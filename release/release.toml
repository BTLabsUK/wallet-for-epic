# What one release builds, proves and publishes: the owner's cut, written down.
# tools/rel reads this file (or the one given with --scope), applies the command line's
# overrides (--only, --skip-platform, --no-variant, --set), refuses anything that does not make
# sense, and keeps the result as the run's release.toml. The live Telegram message, the report
# and the publish gate all show it. Defaults: everything on, stores off.
#
#   tools/rel start 26.10.25                          this file as it is
#   tools/rel start 26.10.25 --only android           only Android (both variants)
#   tools/rel start 26.10.25 --skip-platform macos,ios --no-variant notor
#   tools/rel start 26.10.25 --set stores.play=true --set publish.github=false --skip publish-source="source pushed by hand"
#   tools/rel start 26.10.25 --test                   a TEST run: nothing leaves this machine

# The version being released. Must equal app/pubspec.yaml (tools/version.sh name) at the commit.
# Empty: taken from the command line.
version = ""

# A TEST run: marked TEST in Telegram, publishes only to the scratch target, manifests signed
# with the test key. Cannot be published live.
test = false

# Platforms to build, prove and publish. false = not in this release (shown as "out of scope",
# never as passed).
[platforms]
android = true
linux = true
windows = true
macos = true
ios = true

# Variants of every platform: with Tor, and without Tor (-notor files).
[variants]
tor = true
notor = true

# Store uploads, after the release is live. Off unless asked for.
[stores]
play = false
# After the internal upload, the same bundle onto this testing track too (e.g. "beta", the open
# testing track 26.10.24 went to). Empty: internal only. Production stays a click in Play Console.
play_promote = ""

[publish]
# "live" = the real download server, page, GitHub and manifests; "scratch" = a folder in the run
# (nothing leaves this machine). A TEST run is always scratch.
target = "live"
# Write the two update manifests (the switch). They need both Android variants
# (app/tool/release_android.sh takes both APKs).
manifests = true
# The update notes in the manifest (plain text, no tabs).
notes = ""
# Mirror the release on GitHub (BTLabsUK/wallet-for-epic), on by default: publish-source also pushes the
# source and the tag there, publish-github-release makes the GitHub Release with every file, and
# publish-manifests puts update-v2.json on the latest GitHub Release. BT Labs' server stays the
# primary source: a failed GitHub copy of update-v2.json is a warning, and a failed GitHub
# Release is skipped with `tools/rel skip publish-github-release`. Needs gh logged in as
# btlabs-uk in ~/.config/gh-btlabs (docs/RELEASING.md).
github = true

# How the Mac builds Apple's files (release/pipeline.toml, tools/apple-release.md).
[apple]
# true: the macOS dmg signed with Developer ID, notarised and stapled, and iOS to TestFlight
# (needs the team's signing set-up and [host.apple] team_id). false: what 26.10.24 shipped, for
# test releases: the dmg signed ad hoc (not notarised) and the unsigned ipa, both variants.
signed = true

# Steps to skip, with the reason. Only steps marked skippable in release/pipeline.toml
# (publish-page, publish-source, prune-downloads, store uploads, screens, announce,
# cleanup); builds and gates never: to drop a platform or a variant, switch it off above.
[skip]
# publish-source = "source pushed by hand; owner ok"

# G4 update trust (release/pipeline.toml [proof]).
[proof]
# The previous release to update from: its folder of files (and emulator/ APKs) and its tag.
# Empty: the previous published run of tools/rel.
previous_dir = ""
previous_version = ""
previous_ref = ""
# Platforms the owner lets ship without the update proof, with the reason. The publish gate
# lists them as NOT PROVEN.
[proof.waive]
# macos = "no Apple update test yet; owner waiver 2026-10-30"
