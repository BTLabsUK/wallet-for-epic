# The release pipeline: every step a release runs, in the order the graph gives (needs).
# Read by tools/rel (docs/RELEASING.md). No hosts or addresses here: steps name a host ROLE
# (build, signer, windows, apple, web), and ~/.config/btlabs/release-hosts.toml says what each
# role is on this machine (release/hosts.example.toml). The scripts named in `run` do the work;
# tools/rel decides order, host, gates, logs and state.
#
# Step fields:
#   title      what the live message and the report call it ({variant} is filled in)
#   kind       command (default) | builtin | gate | handoff | publish
#   platform   android | linux | windows | macos | ios, or a list: the step is in the graph only
#              when one of them is in the release's scope (release.toml [platforms])
#   when       scope switches that must all be on, e.g. ["stores.play"] or ["publish.manifests"]
#   for_each   "variant" (one step per variant in scope: -tor, -notor) or "proof_variant"
#              (the variants [proof] update-tests)
#   needs      step names; a name with for_each means all its instances, name@variant the
#              instance of the same variant. Steps the scope leaves out are dropped from needs.
#   host       the role that runs it (default build); the signer role holds the keys
#   lane       steps in one lane run one at a time, lanes side by side ({variant} is filled in).
#              Default: every heavy step one lane, every remote host its own, the rest "local"
#   run        a bash command (set -euo pipefail), from {src} unless cwd says otherwise
#   env        extra environment; {placeholders} below
#   heavy      true: wrapped in build-slot when it exists, one heavy step at a time
#   outputs    files the step leaves in {stage} that are published: copied into {files}
#   extras     files the step leaves in {stage} that are kept but never published ({extra})
#   proof      true: the step must write {stage}/proof.json with every [proof] check true
#   skippable  true: release.toml [skip] may skip it with a reason (builds and gates never)
#   timeout    e.g. "90m"; retries: re-runs on failure before it counts as failed
#   scratch    publish steps: what runs instead when the target is scratch (a builtin name)
#   reuse      repo paths the step's result depends on ("!path" leaves part of a folder out): an
#              earlier run's passing result with the same content (and env, outputs, version) is
#              reused instead of running the step (tools/rellib/reuse.py); reuse_nightly = true
#              also takes a green nightly full check of such a commit
#
# Placeholders: {version} {commit} {short} {run_id} {run} {files} {extra} {stage} {src}
# {variant} {notor} ("" or "-notor") {tor} ("1" or "0") {github} ("1" when publish.github is on, else "0")
# {previous_dir} {previous_version}
# {previous_ref} {node} {epicbox} {target} {scratch} {notes_file} {manifests}
# {rel} (the checkout tools/rel runs from: its step scripts and drivers)
# {host.<role>.<key>} {path.<key>} (both from release-hosts.toml).

[defaults]
state_root = "/tmp/epic-build/rel"
heavy_wrap = ["build-slot"]
min_free_gb = 30
# Pre-flight health pick for test drivers: the first healthy one, BT Labs first.
nodes = ["https://node.btlabs.uk", "https://node.epicnet.us:3413", "https://node.epiccash.com"]
epicboxes = ["epicbox.stackwallet.com", "epicbox.epicnet.us", "epicbox.epiccash.com"]

[relmsg]
bin = "relmsg"
title = "Epic Wallet"

# G4: what "proven" means for a platform. DEFAULT PENDING the owner'S CALL: the previous release
# with a funded wallet, history, custom nodes and relays and changed settings updates the way
# users update to the candidate and keeps all of it; then one send and one receive on BT Labs
# infrastructure. A platform in scope that is not proven stops the release unless release.toml
# waives it ([proof] waive), and the publish gate then shows it as not proven.
[proof]
status = "default pending the owner's call"
checks = ["wallet_opens", "balance_kept", "history_kept", "custom_nodes_kept", "custom_relays_kept", "settings_kept"]
funds_checks = ["send_ok", "receive_ok"]
funds_variant = "tor"
variants = ["tor", "notor"]

[proof.drivers]
android = "{rel}/tools/rellib/drivers/trust-android.sh"
linux = "{rel}/tools/rellib/drivers/trust-linux.sh"
# windows, macos, ios: no driver yet; those platforms are not proven until one exists.

# ---- G0, G1, source -------------------------------------------------------------------------

[step.scope]
title = "G0 scope"
kind = "builtin"
host = "local"

[step.preflight]
title = "G1 preflight"
kind = "builtin"
host = "local"
needs = ["scope"]

[step.source]
title = "Source checkout"
kind = "builtin"
host = "build"
needs = ["preflight"]

[step.source-check]
title = "G2 source gate (tools/check.sh)"
host = "build"
needs = ["source"]
run = "{rel}/tools/rellib/steps/source-check.sh {stage}"
heavy = true
timeout = "120m"
# Reused (not run) when an earlier run or the nightly passed it on the same content of these:
# the app, the bot, the pins and tools/check.sh with what it runs (tools/rellib/reuse.py).
reuse = ["app", "bot", "scripts/linux/flutter.version", "tools/check.sh", "tools/env.sh", "tools/version.sh",
         "tools/lepic.sh", "tools/lepic.rev", "tools/lepic-flutter.rev", "tools/check-install-contract.sh",
         "tools/install_contract.py", "tools/install-contract.json", "docs/install-contract.md",
         "tools/check-no-hosts.sh", "tools/no_hosts.py", "tools/no-hosts.allow"]
reuse_nightly = true

# ---- builds ----------------------------------------------------------------------------------

[step.build-android]
title = "Android APK ({variant})"
platform = "android"
for_each = "variant"
# Android is signed inside the Gradle build, so it runs where the release key is.
host = "signer"
needs = ["source-check"]
run = "app/tool/build_android_release.sh {stage}"
env = { WFE_TOR = "{tor}", WFE_EMULATOR_X86_64 = "1" }
heavy = true
outputs = ["epic-cash-mobile-{version}{notor}-arm64-v8a.apk"]
extras = ["emulator/epic-cash-mobile-{version}{notor}-x86_64.apk"]
timeout = "120m"
# The app without its tests and side tools, the build script and the tools it calls, the pins.
reuse = ["app", "!app/test", "!app/integration_test", "!app/tool", "app/tool/build_android_release.sh",
         "scripts/linux/flutter.version", "tools/env.sh", "tools/version.sh", "tools/lepic.sh", "tools/lepic.rev",
         "tools/lepic-flutter.rev", "tools/build-tor-android.sh", "tools/tor-src.json", "tools/fetch-tor.sh",
         "tools/tor-bundle.json", "tools/dist-check.sh"]

[step.build-play]
title = "Google Play bundle ({variant})"
platform = "android"
when = ["stores.play"]
for_each = "variant"
host = "signer"
needs = ["build-android"]
run = "app/tool/build_android_release.sh {stage}"
env = { WFE_TOR = "{tor}", WFE_DIST = "play" }
heavy = true
extras = ["epic-cash-mobile-{version}{notor}-play.aab"]
timeout = "120m"

[step.build-linux]
title = "Linux AppImage ({variant})"
platform = "linux"
for_each = "variant"
host = "build"
# Its own lane, beside the Android builds (the owner 2026-10-30): it builds in its own container from
# its own copy of the code. Each build still takes a build-slot slot (heavy = true); the two
# Linux variants one after the other. metrics.jsonl has the pair's peak memory ("overlap" lines).
lane = "build-linux"
needs = ["source-check"]
run = "scripts/build-linux.sh && mv -f build-linux/EpicCashDesktop-{version}{notor}-x86_64.AppImage {stage}/"
env = { WFE_TOR = "{tor}", WFE_NODE_BIN = "{path.node_bin_linux}" }
heavy = true
outputs = ["EpicCashDesktop-{version}{notor}-x86_64.AppImage"]
timeout = "120m"
# The app without its tests and side tools, the container build (scripts/), the tools it calls.
reuse = ["app", "!app/test", "!app/integration_test", "!app/tool", "scripts", "tools/env.sh", "tools/version.sh",
         "tools/lepic.rev", "tools/lepic-flutter.rev", "tools/fetch-tor.sh", "tools/tor-bundle.json"]

[step.build-windows]
title = "Windows installer ({variant})"
platform = "windows"
for_each = "variant"
host = "windows"
needs = ["source-check"]
# A fresh work dir per run on the Windows machine (never a stale LEPIC blob from an older run);
# only this run's installer is taken back.
run = "app/tool/build_windows_release_remote.sh {host.windows.ssh} {host.windows.workdir}/{run_id} && mv -f build-windows/epic-cash-desktop-{version}{notor}-windows-x64-setup.exe {stage}/"
env = { WFE_TOR = "{tor}", WFE_NODE_BIN_WIN = "{path.node_bin_windows}" }
outputs = ["epic-cash-desktop-{version}{notor}-windows-x64-setup.exe"]
timeout = "150m"
# The app without its tests and side tools, the two build scripts, the tools and pins they read
# (the Windows toolchain lives on that machine), as for the other builds.
reuse = ["app", "!app/test", "!app/integration_test", "!app/tool", "app/tool/build_windows_release.ps1",
         "app/tool/build_windows_release_remote.sh", "tools/lepic.rev", "tools/lepic-flutter.rev",
         "tools/fetch-tor.sh", "tools/tor-bundle.json"]

# Apple (tools/apple-release.md): the Mac builds, signs with Developer ID, notarises and staples
# (Xcode's automatic signing). Hand-off steps write a job for the Mac and wait for its results;
# Linux then checks the Mac's report before anything can ship. tools/apple-sign.sh (signing on
# Linux) is the backup route only, not in this graph.
[step.apple-mac]
title = "macOS signed + notarised dmg ({variant})"
kind = "handoff"
platform = "macos"
for_each = "variant"
host = "apple"
needs = ["source-check"]
run = "git fetch job/wfe.bundle HEAD && git checkout --detach FETCH_HEAD && test \"$(git rev-parse HEAD)\" = {commit} && RELEASE_COMMIT={commit} WFE_TOR={tor} tools/build-apple.sh mac-release  # then build-apple/mac-release/EpicCashDesktop-{version}{notor}-macos.{dmg,dmg.sha256,REPORT.txt} into results/"
results = ["EpicCashDesktop-{version}{notor}-macos.dmg", "EpicCashDesktop-{version}{notor}-macos.dmg.sha256", "EpicCashDesktop-{version}{notor}-macos.REPORT.txt"]
timeout = "48h"

[step.apple-mac-check]
title = "macOS dmg check: sha256, commit, Team ID, Gatekeeper ({variant})"
platform = "macos"
for_each = "variant"
host = "local"
needs = ["apple-mac@variant"]
run = "{rel}/tools/rellib/steps/apple-mac-check.sh {run}/handoff/apple-mac-{variant}/results EpicCashDesktop-{version}{notor}-macos.dmg {commit} \"{host.apple.team_id}\" {stage}"
outputs = ["EpicCashDesktop-{version}{notor}-macos.dmg"]

# iOS goes to TestFlight from Xcode (Archive → Distribute → App Store Connect): nothing is
# published from here. Only the build without Tor. The builder writes REPORT.txt by hand (the
# build number and "uploaded").
[step.ios-testflight]
title = "iOS to TestFlight"
kind = "handoff"
platform = "ios"
host = "apple"
needs = ["source-check"]
run = "git fetch job/wfe.bundle HEAD && git checkout --detach FETCH_HEAD && test \"$(git rev-parse HEAD)\" = {commit} && RELEASE_COMMIT={commit} WFE_TOR=0 tools/build-apple.sh ios-prepare  # then Xcode Archive → Distribute → App Store Connect; results/REPORT.txt: build number + uploaded"
results = ["REPORT.txt"]
timeout = "48h"

# ---- G3, manifests, G4, G5 -------------------------------------------------------------------

[step.artefacts]
title = "G3 artefacts"
kind = "builtin"
host = "local"
needs = ["build-android", "build-linux", "build-windows", "apple-mac-check", "ios-testflight"]

[step.manifests]
title = "Update manifests (signed)"
host = "signer"
when = ["publish.manifests"]
needs = ["artefacts"]
run = "{rel}/tools/rellib/steps/manifests.sh"
outputs = []

[step.trust-manifest]
title = "G4 manifest checks"
kind = "builtin"
host = "local"
when = ["publish.manifests"]
needs = ["manifests"]

# Update trust runs per platform side by side, from when this machine's builds are done (no driver
# competes with a build for the CPU; every driver starts together, so one that fails at once
# stops none of the others), Windows and macOS also after their own build, Android and Linux
# without waiting for them. The drivers wait on the chain and on P, not on the CPU, and P's legs
# queue on P's own lock. Each Android variant has its own test wallet and emulator (tor: the app
# wallet in rel-trust-android; notor: wallet Q, see trust-android.sh), so the two run at once; each
# Linux variant makes its own wallet in its own sandbox, so they run at once too. G3 and every
# platform's trust still come before the publish gate (update-trust). Whether trust may start
# right after its own build is decided later from metrics.jsonl (per-step load, overlaps,
# emulator health; docs/RELEASING.md).
[step.trust-android]
title = "G4 update trust Android ({variant})"
platform = "android"
for_each = "proof_variant"
host = "build"
lane = "trust-android-{variant}"
needs = ["build-android", "build-play", "build-linux"]
proof = true
timeout = "180m"

[step.trust-linux]
title = "G4 update trust Linux ({variant})"
platform = "linux"
for_each = "proof_variant"
host = "build"
lane = "trust-linux-{variant}"
needs = ["build-android", "build-play", "build-linux"]
proof = true
timeout = "180m"

[step.trust-windows]
title = "G4 update trust Windows ({variant})"
platform = "windows"
for_each = "proof_variant"
host = "build"
lane = "trust-windows"
needs = ["build-android", "build-play", "build-linux", "build-windows@variant"]
proof = true
timeout = "180m"

[step.trust-macos]
title = "G4 update trust macOS ({variant})"
platform = "macos"
for_each = "proof_variant"
host = "build"
lane = "trust-macos"
needs = ["build-android", "build-play", "build-linux", "apple-mac-check@variant"]
proof = true

[step.trust-ios]
title = "G4 update trust iOS ({variant})"
platform = "ios"
for_each = "proof_variant"
host = "build"
lane = "trust-ios"
needs = ["build-android", "build-play", "build-linux", "ios-testflight"]
proof = true

[step.update-trust]
title = "G4 update trust"
kind = "builtin"
host = "local"
needs = ["artefacts", "trust-manifest", "trust-android", "trust-linux", "trust-windows", "trust-macos", "trust-ios"]

[step.publish-gate]
title = "G5 publish gate"
kind = "gate"
host = "local"
needs = ["update-trust"]

# ---- publish, in fixed order: downloads -> page -> source -> manifests last -----------------

[step.publish-downloads]
title = "Publish downloads"
kind = "publish"
host = "web"
needs = ["publish-gate"]
run = "{rel}/tools/rellib/steps/publish-downloads.sh {files} {host.web.ssh} {host.web.downloads_dir}"
scratch = "scratch_downloads"

[step.publish-page]
title = "Publish release page"
kind = "publish"
host = "web"
needs = ["publish-downloads"]
skippable = true
run = "{rel}/tools/rellib/steps/publish-page.sh {version} {files} {path.page_repo}"
# publish.github on: the page links the GitHub Release (build.py add --github).
env = { REL_GITHUB = "{github}" }
scratch = "scratch_page"

[step.publish-source]
title = "Publish source (GitLab)"
kind = "publish"
host = "build"
needs = ["publish-page"]
skippable = true
run = "cd {path.main_checkout} && tools/publish-github.sh --push"
# publish.github on: then mirrored to GitHub (tools/mirror-github.sh), so the tag is there.
env = { GITHUB_MIRROR = "{github}" }
scratch = "scratch_source"

# The GitHub Release of tag v{version}: every published file as an asset, marked latest, so
# github.com/BTLabsUK/wallet-for-epic/releases/latest/download/<name> serves the newest. A mirror:
# BT Labs' server stays the primary source. On a failure `tools/rel skip publish-github-release
# --reason ...` lets the manifests go out without it.
[step.publish-github-release]
title = "Publish GitHub release (mirror)"
kind = "publish"
host = "signer"
when = ["publish.github"]
needs = ["publish-source"]
skippable = true
retries = 1
run = "{rel}/tools/rellib/steps/publish-github-release.sh {version} {files} {stage}"
scratch = "scratch_noop"

[step.publish-manifests]
title = "Publish update manifests (the switch)"
kind = "publish"
host = "signer"
when = ["publish.manifests"]
needs = ["publish-downloads", "publish-page", "publish-source", "publish-github-release"]
run = "tools/publish-update-json.sh {manifests}/update.json {manifests}/update-v2.json"
# publish.github on: update-v2.json also onto the latest GitHub Release (never a gate).
env = { GITHUB_UPDATE_JSON = "{github}" }
scratch = "scratch_manifests"

[step.verify-live]
title = "G6 read back"
kind = "builtin"
host = "local"
publish = true
needs = ["publish-manifests", "publish-downloads", "publish-page"]

[step.prune-downloads]
title = "Prune older downloads"
kind = "publish"
host = "web"
skippable = true
needs = ["verify-live"]
run = "{rel}/tools/rellib/steps/prune-downloads.sh {version} {host.web.ssh} {host.web.downloads_dir} {previous_dir} {manifests}"
scratch = "scratch_prune"

[step.store-play]
title = "Google Play upload (internal)"
kind = "publish"
platform = "android"
when = ["stores.play"]
for_each = "variant"
host = "signer"
skippable = true
needs = ["verify-live", "build-play@variant"]
run = "tools/play-upload.sh {run}/extra/epic-cash-mobile-{version}{notor}-play.aab --track internal --notes-file {notes_file}"
scratch = "scratch_noop"

[step.cleanup]
title = "Cleanup (keep the previous release only)"
kind = "builtin"
host = "local"
publish = true
skippable = true
needs = ["verify-live", "prune-downloads", "store-play"]
