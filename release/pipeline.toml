# The release pipeline: every step a release runs, in the order the graph gives (needs).
# Read by tools/rel (docs/RELEASING.md). No hosts or addresses here: steps name a host ROLE
# (build, signer, windows, apple, web), and ~/.config/btlabs/release-hosts.toml says what each
# role is on this machine (release/hosts.example.toml). The scripts named in `run` do the work;
# tools/rel decides order, host, gates, logs and state.
#
# The flow, in order. Common steps run in both stages; night steps only in `tools/rel start --night`;
# release and publish steps only in a release run. blocks: a failure holds what comes after, and the
# cut. informs: a failure is shown and holds nothing (warn_only).
# flow:begin (tools/rel flow --write; a test fails when it differs from the steps below)
# common   blocks   scope                    needs -
# common   blocks   preflight                needs scope
# common   blocks   source                   needs preflight
# common   blocks   source-check             needs source
# night    blocks   testbuild-android        needs source, source-check
# night    blocks   testbuild-linux          needs source, source-check
# night    blocks   testbuild-windows        needs source, source-check
# night    blocks   flow-android             needs testbuild-android@variant
# night    blocks   flow-linux               needs testbuild-linux@variant
# night    blocks   flow-windows             needs testbuild-windows@variant
# night    informs  create-android           needs flow-android@variant
# night    informs  create-linux             needs flow-linux@variant
# night    informs  dry-walk                 needs source, source-check
# night    informs  lane-payments-linux      needs testbuild-linux@variant
# night    informs  lane-pairing-linux       needs testbuild-linux@variant
# night    informs  lane-linking-linux       needs testbuild-linux@variant
# night    informs  create-windows           needs flow-windows@variant
# night    informs  trust-pair-linux         needs -
# night    informs  trust-pair-linux-notor   needs -
# night    informs  trust-pair-android       needs -
# night    informs  trust-pair-windows       needs -
# release  blocks   hosted-dispatch          needs source, source-check
# release  blocks   build-android            needs source, source-check, hosted-dispatch; outputs bt-wallet-{version}{notor}-android-arm64-v8a.apk
# release  blocks   build-play               needs build-android
# release  blocks   build-linux              needs source, source-check, hosted-dispatch; outputs bt-wallet-{version}{notor}-linux-x86_64.AppImage
# release  blocks   build-windows            needs source, source-check, hosted-dispatch; outputs bt-wallet-{version}{notor}-windows-x64-setup.exe
# release  blocks   apple-mac                needs source, source-check
# release  blocks   apple-mac-check          needs apple-mac@variant; outputs bt-wallet-{version}{notor}-macos.dmg
# release  blocks   ios-testflight           needs source, source-check
# release  blocks   apple-adhoc              needs source, source-check
# release  blocks   apple-adhoc-mac          needs apple-adhoc@variant; outputs bt-wallet-{version}{notor}-macos.dmg
# release  blocks   apple-adhoc-ios          needs apple-adhoc@variant; outputs bt-wallet-{version}{notor}-ios-unsigned.ipa
# release  blocks   sign-android             needs build-android, build-play, build-linux, build-windows, apple-mac-check, ios-testflight, apple-adhoc-mac, apple-adhoc-ios
# release  informs  screens                  needs source, source-check, build-android, build-play, build-linux
# release  blocks   artefacts                needs build-android, sign-android, build-linux, build-windows, apple-mac-check, ios-testflight, apple-adhoc-mac, apple-adhoc-ios
# release  blocks   manifests                needs artefacts
# release  blocks   trust-manifest           needs manifests
# release  blocks   trust-android            needs build-android, build-play, sign-android, build-linux
# release  blocks   trust-linux              needs build-android, build-play, build-linux
# release  blocks   trust-windows            needs build-android, build-play, build-linux, build-windows@variant
# release  blocks   trust-macos              needs build-android, build-play, sign-android, build-linux, apple-mac-check@variant, apple-adhoc-mac@variant
# release  blocks   trust-ios                needs build-android, build-play, sign-android, build-linux, ios-testflight, apple-adhoc-ios@variant
# release  blocks   update-trust             needs artefacts, trust-manifest, trust-android, trust-linux, trust-windows, trust-macos, trust-ios
# release  blocks   screens-check            needs screens, update-trust
# release  blocks   publish-gate             needs update-trust, screens-check
# publish  blocks   tag                      needs publish-gate
# publish  blocks   publish-downloads        needs tag
# publish  blocks   publish-page             needs publish-downloads
# publish  blocks   publish-source           needs publish-page
# publish  blocks   publish-github-release   needs publish-source
# publish  blocks   publish-manifests        needs publish-downloads, publish-page, publish-source, publish-github-release
# publish  blocks   verify-live              needs publish-manifests, publish-downloads, publish-page
# publish  blocks   prune-downloads          needs verify-live
# publish  blocks   store-play               needs verify-live, build-play@variant
# publish  blocks   store-play-promote       needs store-play
# publish  informs  screens-publish          needs verify-live
# publish  informs  announce                 needs verify-live
# publish  informs  key-copies               needs verify-live
# publish  blocks   cleanup                  needs verify-live, prune-downloads, store-play, store-play-promote, screens-publish, announce, key-copies
# flow:end
#
# Step fields:
#   title      what the live message and the report call it ({variant} is filled in)
#   kind       command (default) | builtin | gate | handoff | publish
#   platform   android | linux | windows | macos | ios, or a list: the step is in the graph only
#              when one of them is in the release's scope (release.toml [platforms])
#   when       scope switches that must all be on, e.g. ["stores.play"] or ["publish.manifests"];
#              the string "night" puts the step in the night stage (`tools/rel start --night`) only
#   unless     scope switches that must all be off, e.g. ["apple.signed"]
#   for_each   "variant" (one step per variant in scope: -tor, -notor) or "proof_variant"
#              (the variants [proof] tests; a step's own `variants` replaces that list)
#   needs      step names; a name with for_each means all its instances, name@variant the
#              instance of the same variant. Steps the scope leaves out are dropped from needs.
#   host       the role that runs it (default build); the signer role holds the keys
#   lane       steps in one lane run one at a time, lanes side by side ({variant} is filled in).
#              Default: every heavy step one lane, every remote host its own, the rest "local"
#   run        a bash command (set -euo pipefail), from {src} unless cwd says otherwise
#   env        extra environment; {placeholders} below
#   heavy      true: wrapped in build-slot when it exists, one heavy step at a time
#   outputs    files the step leaves in {stage} that are published: copied into {files}
#   extras     files the step leaves in {stage} that are kept but never published ({extra})
#   variants   with for_each: only these variants, e.g. ["tor"] (Play takes one bundle per version code)
#   by_variant with for_each: per variant, its own run, results, outputs or title, e.g.
#              by_variant.tor.results = [...] (the Mac's hand-off with Tor builds no iOS app)
#   proof      true: the step must write {stage}/proof.json with every [proof] check true
#   skippable  true: release.toml [skip] may skip it with a reason (builds and gates never)
#   publish    true: a command step of the publish phase (after the gate); kind publish implies it
#   warn_only  true: a failure is shown as a warning (relmsg: failed, no alert; report: warned) and
#              holds nothing; the run still ends ok. A lane with it Informs, one without it Blocks
#              (`tools/rel lanes`, `tools/rel lane <base> blocks|informs`). For night lanes, after-publish
#              steps and the pre-gate screens render, whose result screens-check judges (never a
#              gate, proof or build). A run's plan.json freezes it: a change applies to the next run
#   timeout    e.g. "90m", a hard limit (then killed; never retried by itself); a build-phase command
#              without one gets [defaults] timeout. retries: re-runs on any failure before it
#              counts as failed (infrastructure failures retry by themselves: [concurrency])
#   capped     true: counts toward [concurrency] max_heavy although it is not heavy itself
#   remote     true: the step's load is on another machine (the Windows rigs), so it never counts
#              toward max_heavy here; apart still applies
#   scratch    publish steps: what runs instead when the target is scratch (a builtin name)
#   A step may leave links.json ([{label, url}]) and notice.json ({title, detail, expects}) in
#              {stage}: tools/rel adds the links to the live message and sends the notice once.
#   reuse      repo paths the step's result depends on ("!path" leaves part of a folder out): an
#              earlier run's passing result with the same content (and env, outputs, version) is
#              reused instead of running the step (tools/rellib/reuse.py); reuse_nightly = true
#              also takes a green nightly full check of such a commit, reuse_green = true any
#              green `tools/check.sh --full` on a clean tree of one (/tmp/epic-build/green/<sha>.json)
#
# Placeholders: {version} {commit} {short} {run_id} {run} {files} {extra} {stage} {src}
# {variant} {notor} ("" or "-notor") {tor} ("1" or "0") {github} ("1" when publish.github is on, else "0")
# {play_promote} (release.toml stores.play_promote, e.g. "beta", or "")
# {previous_dir} {previous_version}
# {previous_ref} {node} {epicbox} {target} {scratch} {notes_file} {manifests}
# {rel} (the checkout tools/rel runs from: its step scripts and drivers)
# {host.<role>.<key>} {path.<key>} (both from release-hosts.toml).

[defaults]
state_root = "/tmp/epic-build/rel"
heavy_wrap = ["build-slot"]
min_free_gb = 30
# The hard limit of a build-phase command step that sets no `timeout` of its own.
timeout = "180m"
# Pre-flight health pick for test drivers: the first healthy one, BT Labs first.
nodes = ["https://node.btlabs.uk", "https://node.epicnet.us:3413", "https://node.epiccash.com"]
epicboxes = ["epicbox.stackwallet.com", "epicbox.epicnet.us", "epicbox.epiccash.com"]

# The signed update manifests (update.json, update-v2.json; WAL-01). validity_days is how long a
# signed manifest is valid (expires_at - issued_at), for a release, a rollback and
# `tools/rel resign`; clients accept at most 400 (btlabs-public FORMAT.md section 5). 45 days
# with a `tools/rel resign` once a month (the owner, 2026-10-31): a frozen or stalled feed goes stale
# within weeks (docs/RELEASING.md, "Re-signing the live manifests"). warn_days: G1 and
# `tools/rel doctor` warn when the live manifest expires sooner than that.
[manifest]
validity_days = 45
warn_days = 14

[relmsg]
bin = "relmsg"
title = "Epic Wallet"

# The gate watcher (tools/rellib/gatewatch.py): once the publish or rollback gate waits, it checks
# every watch_every seconds and runs `tools/rel publish` as soon as the owner approves; it gives up
# after watch_hours without a decision.
[gate]
watch_every = 60
watch_hours = 72

# The night stage (`tools/rel start --night`): its run folders, and lanes/<sha>.json beside them, one
# per commit, which `tools/rel cut` and the gate note read. Its events go to the release's tests.db.
# One line per failed attempt, also in tests.db (`testdb bugs`) and each run's journal.
[ledger]
path = ".test-results/bug-ledger.jsonl"

[night]
state_root = "/tmp/epic-build/nightly/rel"

# How a run shares this machine (tools/rellib/window.py; docs/RELEASING.md, "Sharing the
# machine"). 26.10.25 run-8 lost every Android and Windows trust lane ("no proof.json (driver
# exit -15)" at about 1,190 s) with 7-9 steps side by side at load 36 and 17-22 GB in use.
# max_heavy: heavy steps at once (heavy, proof or capped); `tools/rel start|resume|sign
# --max-heavy N` changes it for a run. apart: pairs that never run together. apart_shared: pairs
# kept apart only while agents share the machine (shared; --exclusive-machine turns it off for a
# run). A step kept apart from source-check also waits up to external_wait while a build-slot
# slot runs one of external_suites. infra_retries: automatic retries of a failure caused by the
# machine (a signal, no proof.json, an ssh drop, no build slot); product failures never retry.
# window_marker: the release window file build-slot reads (default
# $XDG_RUNTIME_DIR/wfe-release-window, i.e. /run/user/<uid>/wfe-release-window).
#
# max_heavy = 2 (2026-11-05): the Android chain (test build, flow, create) in one slot, the Linux
# chain (test build, flow, create, the two-wallet lanes) in the other; the Windows lanes run on the
# rigs (remote) and start beside both at once. Sized from metrics.jsonl on
# 16 CPUs and 30 GB: 26.11.2 run-3 (trust-android-tor 1,759 s, create-android-tor 187 s,
# trust-linux-tor 669 s, create-linux-tor 66 s) at --max-heavy 4 peaked at load 13.3 and 21 GB;
# 26.10.26 run-4 with two Android lanes at once reached load 52.9 and 23.4 GB; 26.10.25 run-8 (6
# lanes, load 25.7, 17.4 GB, the lanes above lost); a Windows lane adds load 1-2 here. The Android
# chain bounds the run, so 2 slots give the wall time of 4 at half the load.
[concurrency]
max_heavy = 2
shared = true
# The Android and Windows lanes (package, flow, create) never beside a full suite, in the run or
# one outside it (external_suites).
apart = [["source-check", "trust-android"], ["source-check", "trust-windows"],
         ["source-check", "flow-android"], ["source-check", "flow-windows"],
         ["source-check", "create-android"], ["source-check", "create-windows"]]
# The Windows lanes run on the rigs (remote): never held back by Android here (2026-11-03,
# 26.11.0 run-3 waited 20 min with five healthy rigs).
apart_shared = []
external_suites = ["check.sh --full", "flutter-test-all", "source-check.sh"]
external_wait = "60m"
infra_retries = 1

# When sign-android asks for the owner's code. The signer binds the code to the exact bytes, so it
# can only be asked once every build is in. "on-demand": the step then waits (exit 10) while the
# other lanes go on, the owner gets one message, and `tools/rel sign` asks when he is ready (two runs
# lost 1,804 s each to a code that did not come in the 35 min a request waits). "inline": ask at
# once and wait for it (`tools/rel start --sign-inline` does that for one run).
[sign]
when = "on-demand"

# Per-lane health of the G4 trust lanes (tools/rellib/health.py; docs/RELEASING.md, "Lane health"),
# read from metrics.jsonl over the last `runs` runs. A lane whose first try passed in less than
# min_first_try of its runs (with at least min_runs runs) is weak: summary.md, report.html, the gate
# message and `tools/rel stats --lanes` show it. A weak lane still gates; nothing is quarantined.
[health]
runs = 10
min_first_try = 0.8
min_runs = 3

# A failed G4 lane: the server-side log lines for its window go to steps/<id>/out/server-logs.txt
# and, quoted, into the alert and the gate (tools/rellib/serverlogs.py). Read only: our server's
# node log and Epicbox relay journal over ssh, the hermetic node's and relay's logs here. The server
# (ssh, remote_node_log, known_ips) is named in [serverlogs] of the machine's release-hosts.toml.
[serverlogs]
enabled = true
remote_relay_unit = "epic-floonet-epicbox"
local_node_log = "/tmp/epic-build/rel/hermetic/var/log/epic-server.log"
local_relay_log = "/tmp/epic-build/rel/hermetic/var/log/relay.log"
pad_s = 60
per_source = 40
quote = 3

# G4: what "proven" means for a platform. DEFAULT PENDING the owner'S CALL: the previous release
# with a funded wallet, history, custom nodes and relays and changed settings updates the way
# users update to the candidate and keeps all of it; then one send and one receive on BT Labs
# infrastructure. A platform in scope that is not proven stops the release unless release.toml
# waives it ([proof] waive), and the publish gate then shows it as not proven.
[proof]
status = "default pending the owner's call"
# restore_ok: a lane that starts from its permanent wallet (drivers/core/lane_seed.py) restored the
# balance it had on record; "not applicable" for a lane without a seed.
checks = ["wallet_opens", "balance_kept", "history_kept", "custom_nodes_kept", "custom_relays_kept", "settings_kept",
          "store_encrypted", "app_files_kept", "lan_nodes_kept", "contact_note_kept", "restore_ok"]
funds_checks = ["send_ok", "receive_ok"]
# A new app beside the previous one (app id changed, authorised: the owner 2026-11-02 for 26.10.25):
# the wallet is restored from its phrase, so the checks on carried data do not apply. Only for
# these (previous, candidate) package pairs, and only when the driver's proof says "beside".
beside_pairs = [["uk.btlabs.epiccash.mobile", "uk.btlabs.btwallet"]]
beside_not_applicable = ["history_kept", "custom_nodes_kept", "custom_relays_kept", "settings_kept",
                         "store_encrypted", "app_files_kept", "lan_nodes_kept", "contact_note_kept"]
funds_variant = "tor"
# Which lanes run the send and receive legs: "flow" (the night's flow lanes on the test build;
# 2026-11-05) or "proof" (the G4 lanes on the release files).
funds_in = "flow"
# The builds tested on rigs and devices (trust-*, flow-*, create-*), the owner 2026-11-05: Tor only. The notor
# builds are still built, verified (checksums, attestation, platform verify) and shipped. iOS has only
# a notor build: trust-ios names it itself.
variants = ["tor"]

# Each driver first has the hermetic node and relay up on this machine (tools/rellib/hermetic/up.sh:
# idempotent, a running service is left alone, one lane at a time). It exits 1 while the node still
# syncs or a service is not healthy: the driver runs anyway, and its prepare (drivers/core/hermetic.py
# plan) uses what status.json says is healthy, records why not for the rest in proof.json
# details["hermetic"], and refuses to run without both only under REL_HERMETIC=1. Any other exit of
# up.sh stops the step.
[proof.drivers]
android = "bash {rel}/tools/rellib/hermetic/up.sh || [ $? -eq 1 ]; {rel}/tools/rellib/drivers/trust-android.sh"
linux = "bash {rel}/tools/rellib/hermetic/up.sh || [ $? -eq 1 ]; {rel}/tools/rellib/drivers/trust-linux.sh"
windows = "bash {rel}/tools/rellib/hermetic/up.sh || [ $? -eq 1 ]; {rel}/tools/rellib/drivers/trust-windows.sh"
# ios: an iPhone Simulator on a Mac over ssh (trust-ios.sh; REL_IOS_SSH, default bob-mac), notor only.
ios = "bash {rel}/tools/rellib/hermetic/up.sh || [ $? -eq 1 ]; {rel}/tools/rellib/drivers/trust-ios.sh"
# macos: no driver yet; it is not proven until one exists.

# ---- hosted builds ---------------------------------------------------------------------------
# `tools/rel start --builds hosted`: build-android, build-linux and build-windows (the steps with a
# `hosted` key) build on GitHub runners from the published twin of the release commit, and
# build-fetch takes their files back after it verifies them (tools/rellib/hosted.py). One dispatch
# per run, no retry, no local fallback: a failed or late build fails its step. {build_id} (WFE_BUILD_ID,
# the About line, local and hosted builds) is the published short commit, else the local one.
[hosted]
repo = "BTLabsUK/wallet-for-epic"
workflow = "build.yml"
gh_config = "~/.config/gh-btlabs"
account = "btlabs-uk"
commit_map = "~/publish/wallet-for-epic.commit-map"
# One JSON line per dispatch; the cap counts the last 24 h.
state = "/tmp/epic-build/rel/hosted-dispatches.jsonl"
max_per_day = 8
ramp_until = "2026-11-10"
ramp_max_per_day = 2
poll = "30s"
# Builds go out in waves; each wave is one dispatch and counts toward the cap. One wave: every build
# in one dispatch (the owner 2026-11-03, 26.11.0). [["tor"], ["notor"]] sends the Tor builds first and
# the no-Tor builds only once every Tor build is in (fetched and verified); a failed Tor build stops
# it there.
waves = [["tor", "notor"]]

# From the dispatch to the files, per platform. The workflow's own job timeouts (75 min android
# and linux, 90 min windows) fire first.
[hosted.deadline]
android = "90m"
linux = "90m"
windows = "105m"

# ---- common to night and release: G0, G1, source, G2 ------------------------------------------

[step.scope]
title = "G0 scope"
kind = "builtin"
host = "local"

[step.preflight]
title = "G1 preflight"
kind = "builtin"
host = "local"
needs = ["scope"]

[step.source]
title = "Source checkout"
kind = "builtin"
host = "build"
needs = ["preflight"]

[step.source-check]
title = "G2 source gate (tools/check.sh)"
host = "build"
needs = ["source"]
run = "{rel}/tools/rellib/steps/source-check.sh {stage}"
heavy = true
timeout = "120m"
# Skippable only with the owner's reason (`--skip source-check="…"`); the report and the gate message
# then say SKIPPED with it.
skippable = true
# Reused (not run) when an earlier run or the nightly passed it on the same content of these: the
# app, the bot, the pins and tools/check.sh with what it runs (tools/rellib/reuse.py). The release
# tools are not in it: a change to them alone does not rerun G2, their tests run when they change. A
# candidate that differs from a green commit only by its version (tools/version.sh set) counts as
# that commit (not release/release.toml either: the scope is edited for every release).
reuse = ["app", "bot", "scripts/linux/flutter.version", "tools/check.sh", "tools/env.sh", "tools/version.sh",
         "tools/lepic.sh", "tools/lepic.rev", "tools/lepic-flutter.rev", "tools/check-install-contract.sh",
         "tools/install_contract.py", "tools/install-contract.json", "docs/install-contract.md",
         "tools/check-no-hosts.sh", "tools/no_hosts.py", "tools/no-hosts.allow"]
reuse_nightly = true
# Any green `tools/check.sh --full` (full and full-notor) on a clean tree with this content (the
# nightly's, a person's on the candidate). Without one G2 runs in the run, and nothing builds or
# dispatches before it passed.
reuse_green = true

# ---- night: the lanes on a test build, every night ---------------------------------------------
# `tools/rel start --night` runs these (when = "night") after G2, on a quick local test build of the
# main tip, keep going. A release cut starts from a commit whose night was green (`tools/rel cut`), so
# a release run has none of them. The night lanes are the update lane's checks with the send and
# receive legs (REL_TRUST_MODE=flow: previous and candidate are the same test build, the update a
# reinstall of it), a new user's wallet (create-*), and the Linux lanes between two wallets
# (lane-*-linux). Tor builds only, as [proof] variants. The test builds are never shipped: they stay
# in their steps' folders. One chain per platform, in its trust lane: Android in one [concurrency]
# slot, Linux in the other, Windows on its rig beside both.

[step.testbuild-android]
title = "Android test build ({variant})"
when = "night"
platform = "android"
for_each = "proof_variant"
host = "build"
lane = "trust-android-{variant}"
needs = ["source", "source-check"]
# The emulator APK, unsigned like the release build, then signed with this machine's debug key.
run = "{rel}/tools/rellib/steps/testbuild-android.sh {stage}"
env = { WFE_TOR = "{tor}", WFE_BUILD_ID = "{build_id}" }
heavy = true
timeout = "60m"

[step.testbuild-linux]
title = "Linux test build ({variant})"
when = "night"
platform = "linux"
for_each = "proof_variant"
host = "build"
lane = "trust-linux-{variant}"
needs = ["source", "source-check"]
run = "scripts/build-linux.sh && mv -f build-linux/bt-wallet-{version}{notor}-linux-x86_64.AppImage {stage}/"
env = { WFE_TOR = "{tor}", WFE_NODE_BIN = "{path.node_bin_linux}", WFE_BUILD_ID = "{build_id}" }
heavy = true
timeout = "60m"

[step.testbuild-windows]
title = "Windows test build ({variant})"
when = "night"
platform = "windows"
for_each = "proof_variant"
host = "windows"
lane = "trust-windows-{variant}"
needs = ["source", "source-check"]
# Its own work dir on the Windows machine; the variant's LEPIC cargo target, as build-windows.
run = "app/tool/build_windows_release_remote.sh {host.windows.ssh} {host.windows.workdir}/{run_id}-{short}-test-{variant} && mv -f build-windows/bt-wallet-{version}{notor}-windows-x64-setup.exe {stage}/"
env = { WFE_TOR = "{tor}", WFE_NODE_BIN_WIN = "{path.node_bin_windows}", WFE_BUILD_ID = "{build_id}", WFE_CARGO_TARGET = "{host.windows.workdir}/cargo-target/{variant}" }
timeout = "90m"

# The update lane's driver on the test build (drivers/core/lane.py REL_TRUST_MODE=flow): every
# [proof] check and, per [proof] funds_in, the send and receive legs. Fails closed on proof.json
# like a proof step; never counts as release proof and saves no trust state.
[step.flow-android]
title = "Flows on the test build, Android ({variant})"
when = "night"
platform = "android"
for_each = "proof_variant"
host = "build"
lane = "trust-android-{variant}"
needs = ["testbuild-android@variant"]
capped = true
run = "bash {rel}/tools/rellib/hermetic/up.sh || [ $? -eq 1 ]; {rel}/tools/rellib/drivers/trust-android.sh"
timeout = "50m"
env = { REL_TRUST_MODE = "flow", REL_PREVIOUS_DIR = "{run}/steps/testbuild-android-{variant}/out", REL_PREVIOUS_EXTRA = "{run}/steps/testbuild-android-{variant}/out", REL_PREVIOUS_VERSION = "{version}", REL_PREVIOUS_REF = "", REL_CANDIDATE_DIR = "{run}/steps/testbuild-android-{variant}/out", REL_CANDIDATE_EXTRA = "{run}/steps/testbuild-android-{variant}/out" }

[step.flow-linux]
title = "Flows on the test build, Linux ({variant})"
when = "night"
platform = "linux"
for_each = "proof_variant"
host = "build"
lane = "trust-linux-{variant}"
needs = ["testbuild-linux@variant"]
capped = true
run = "bash {rel}/tools/rellib/hermetic/up.sh || [ $? -eq 1 ]; {rel}/tools/rellib/drivers/trust-linux.sh"
timeout = "60m"
env = { REL_TRUST_MODE = "flow", REL_PREVIOUS_DIR = "{run}/steps/testbuild-linux-{variant}/out", REL_PREVIOUS_EXTRA = "{run}/steps/testbuild-linux-{variant}/out", REL_PREVIOUS_VERSION = "{version}", REL_PREVIOUS_REF = "", REL_CANDIDATE_DIR = "{run}/steps/testbuild-linux-{variant}/out", REL_CANDIDATE_EXTRA = "{run}/steps/testbuild-linux-{variant}/out" }

[step.flow-windows]
title = "Flows on the test build, Windows ({variant})"
when = "night"
platform = "windows"
for_each = "proof_variant"
host = "build"
lane = "trust-windows-{variant}"
needs = ["testbuild-windows@variant"]
remote = true
run = "bash {rel}/tools/rellib/hermetic/up.sh || [ $? -eq 1 ]; {rel}/tools/rellib/drivers/trust-windows.sh"
timeout = "50m"
env = { REL_TRUST_MODE = "flow", REL_PREVIOUS_DIR = "{run}/steps/testbuild-windows-{variant}/out", REL_PREVIOUS_EXTRA = "{run}/steps/testbuild-windows-{variant}/out", REL_PREVIOUS_VERSION = "{version}", REL_PREVIOUS_REF = "", REL_CANDIDATE_DIR = "{run}/steps/testbuild-windows-{variant}/out", REL_CANDIDATE_EXTRA = "{run}/steps/testbuild-windows-{variant}/out" }

# A new user's first start (REL_TRUST_MODE=create, drivers/core/lane.py): the test build installed
# with no app data, a wallet created through its screens and its home reached (check create_ok). No
# funds; the phrase is checked and dropped. On the lane's own emulator, sandbox or rig, after that
# platform's flow lane. A warning only: not a proof step.
[step.create-android]
title = "New wallet on the candidate, Android ({variant})"
when = "night"
platform = "android"
for_each = "proof_variant"
variants = ["tor"]
host = "build"
lane = "trust-android-{variant}"
needs = ["flow-android@variant"]
warn_only = true
capped = true
run = "{rel}/tools/rellib/drivers/trust-android.sh"
timeout = "30m"
env = { REL_TRUST_MODE = "create", REL_OUT = "{stage}", REL_CHECKS = "create_ok", REL_FUNDS = "0", REL_CANDIDATE_DIR = "{run}/steps/testbuild-android-{variant}/out", REL_CANDIDATE_EXTRA = "{run}/steps/testbuild-android-{variant}/out", REL_CANDIDATE_SRC = "{src}", REL_CANDIDATE_VERSION = "{version}" }

[step.create-linux]
title = "New wallet on the candidate, Linux ({variant})"
when = "night"
platform = "linux"
for_each = "proof_variant"
variants = ["tor"]
host = "build"
lane = "trust-linux-{variant}"
needs = ["flow-linux@variant"]
warn_only = true
capped = true
run = "{rel}/tools/rellib/drivers/trust-linux.sh"
timeout = "30m"
env = { REL_TRUST_MODE = "create", REL_OUT = "{stage}", REL_CHECKS = "create_ok", REL_FUNDS = "0", REL_CANDIDATE_DIR = "{run}/steps/testbuild-linux-{variant}/out", REL_CANDIDATE_EXTRA = "{run}/steps/testbuild-linux-{variant}/out", REL_CANDIDATE_SRC = "{src}", REL_CANDIDATE_VERSION = "{version}" }

# The seeded dry walk: both tours visit the lanes' screens, no coins, no device. Fails when a target
# a driver presses is on no screen (tools/ui-targets walk names the driver step).
[step.dry-walk]
title = "Seeded dry walk of the lanes' screens"
when = "night"
host = "build"
lane = "screens"
needs = ["source", "source-check"]
warn_only = true
heavy = true
run = "{rel}/tools/dry-walk.sh {stage}/walk"
timeout = "60m"

# The Linux lanes between two wallets: two wallets on the test build pay each other 0.01 by Epicbox,
# Link · HTTP, Link · Tor and File (payments), pair (pairing) and link (linking). P funds A (at most
# 0.1 EPIC a run) and every coin goes back to P in the same run (linux/tx_lane.py). REL_TX_PART picks
# the part; each starts alone from saved state, so a failure in one holds nothing of the others. No
# timing from a release run yet: each limit stays 150 min.
[step.lane-payments-linux]
title = "Payments between two wallets, Linux ({variant})"
when = "night"
platform = "linux"
for_each = "proof_variant"
variants = ["tor"]
host = "build"
lane = "trust-linux-{variant}"
needs = ["testbuild-linux@variant"]
warn_only = true
capped = true
run = "bash {rel}/tools/rellib/hermetic/up.sh || [ $? -eq 1 ]; {rel}/tools/rellib/drivers/trust-tx-linux.sh"
timeout = "150m"
env = { REL_TX_PART = "payments", REL_OUT = "{stage}", REL_FUNDS = "1", REL_CANDIDATE_DIR = "{run}/steps/testbuild-linux-{variant}/out", REL_CANDIDATE_SRC = "{src}", REL_CANDIDATE_VERSION = "{version}" }

[step.lane-pairing-linux]
title = "Pairing between two wallets, Linux ({variant})"
when = "night"
platform = "linux"
for_each = "proof_variant"
variants = ["tor"]
host = "build"
lane = "trust-linux-{variant}"
needs = ["testbuild-linux@variant"]
warn_only = true
capped = true
run = "bash {rel}/tools/rellib/hermetic/up.sh || [ $? -eq 1 ]; {rel}/tools/rellib/drivers/trust-tx-linux.sh"
timeout = "150m"
env = { REL_TX_PART = "pairing", REL_OUT = "{stage}", REL_FUNDS = "1", REL_CANDIDATE_DIR = "{run}/steps/testbuild-linux-{variant}/out", REL_CANDIDATE_SRC = "{src}", REL_CANDIDATE_VERSION = "{version}" }

[step.lane-linking-linux]
