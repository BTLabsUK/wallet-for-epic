# The release pipeline: every step a release runs, in the order the graph gives (needs).
# Read by tools/rel (docs/RELEASING.md). No hosts or addresses here: steps name a host ROLE
# (build, signer, windows, apple, web), and ~/.config/btlabs/release-hosts.toml says what each
# role is on this machine (release/hosts.example.toml). The scripts named in `run` do the work;
# tools/rel decides order, host, gates, logs and state.
#
# The flow, in order: common steps, then the release steps up to the publish gate, then the publish
# steps. blocks: a failure holds what comes after. informs: a failure is shown and holds nothing
# (warn_only).
# flow:begin (tools/rel flow --write; a test fails when it differs from the steps below)
# common   blocks   scope                    needs -
# common   blocks   preflight                needs scope
# common   blocks   source                   needs preflight
# common   blocks   source-check             needs source
# release  blocks   hosted-dispatch          needs source, source-check
# release  blocks   build-android            needs source, source-check, hosted-dispatch; outputs bt-wallet-{version}{notor}-android-arm64-v8a.apk
# release  blocks   build-play               needs build-android
# release  blocks   build-linux              needs source, source-check, hosted-dispatch; outputs bt-wallet-{version}{notor}-linux-x86_64.AppImage
# release  blocks   build-windows            needs source, source-check, hosted-dispatch; outputs bt-wallet-{version}{notor}-windows-x64-setup.exe
# release  blocks   apple-mac                needs source, source-check
# release  blocks   apple-mac-check          needs apple-mac@variant; outputs bt-wallet-{version}{notor}-macos.dmg
# release  blocks   ios-testflight           needs source, source-check
# release  blocks   apple-adhoc              needs source, source-check
# release  blocks   apple-adhoc-mac          needs apple-adhoc@variant; outputs bt-wallet-{version}{notor}-macos.dmg
# release  blocks   apple-adhoc-ios          needs apple-adhoc@variant; outputs bt-wallet-{version}{notor}-ios-unsigned.ipa
# release  blocks   sign-android             needs build-android, build-play, build-linux, build-windows, apple-mac-check, ios-testflight, apple-adhoc-mac, apple-adhoc-ios
# release  informs  screens                  needs source, source-check, build-android, build-play, build-linux
# release  blocks   artefacts                needs build-android, sign-android, build-linux, build-windows, apple-mac-check, ios-testflight, apple-adhoc-mac, apple-adhoc-ios
# release  blocks   manifests                needs artefacts
# release  blocks   trust-manifest           needs manifests
# release  blocks   publish-gate             needs artefacts, trust-manifest
# publish  blocks   tag                      needs publish-gate
# publish  blocks   publish-downloads        needs tag
# publish  blocks   publish-page             needs publish-downloads
# publish  blocks   publish-source           needs publish-page
# publish  blocks   publish-github-release   needs publish-source
# publish  blocks   publish-manifests        needs publish-downloads, publish-page, publish-source, publish-github-release
# publish  blocks   verify-live              needs publish-manifests, publish-downloads, publish-page
# publish  blocks   prune-downloads          needs verify-live
# publish  blocks   store-play               needs verify-live, build-play@variant
# publish  blocks   store-play-promote       needs store-play
# publish  informs  screens-publish          needs verify-live, screens
# publish  informs  announce                 needs verify-live
# publish  informs  key-copies               needs verify-live
# publish  blocks   cleanup                  needs verify-live, prune-downloads, store-play, store-play-promote, screens-publish, announce, key-copies
# flow:end
#
# Step fields:
#   title      what the live message and the report call it ({variant} is filled in)
#   kind       command (default) | builtin | gate | handoff | publish
#   platform   android | linux | windows | macos | ios, or a list: the step is in the graph only
#              when one of them is in the release's scope (release.toml [platforms])
#   when       scope switches that must all be on, e.g. ["stores.play"] or ["publish.manifests"]
#   unless     scope switches that must all be off, e.g. ["apple.signed"]
#   for_each   "variant" (one step per variant in scope: -tor, -notor)
#   needs      step names; a name with for_each means all its instances, name@variant the
#              instance of the same variant. Steps the scope leaves out are dropped from needs.
#   host       the role that runs it (default build); the signer role holds the keys
#   lane       steps in one lane run one at a time, lanes side by side ({variant} is filled in).
#              Default: every heavy step one lane, every remote host its own, the rest "local"
#   run        a bash command (set -euo pipefail), from {src} unless cwd says otherwise
#   env        extra environment; {placeholders} below
#   heavy      true: wrapped in build-slot when it exists, one heavy step at a time
#   outputs    files the step leaves in {stage} that are published: copied into {files}
#   extras     files the step leaves in {stage} that are kept but never published ({extra})
#   variants   with for_each: only these variants, e.g. ["tor"] (Play takes one bundle per version code)
#   by_variant with for_each: per variant, its own run, results, outputs or title, e.g.
#              by_variant.tor.results = [...] (the Mac's hand-off with Tor builds no iOS app)
#   skippable  true: release.toml [skip] may skip it with a reason (builds and gates never)
#   publish    true: a command step of the publish phase (after the gate); kind publish implies it
#   warn_only  true: a failure is shown as a warning (relmsg: failed, no alert; report: warned) and
#              holds nothing; the run still ends ok. For after-publish steps and the screens render
#              (never a gate or a build). A run's plan.json freezes it: a change applies to the next run
#   needs_ok   needs whose warned (failed warn_only) or skipped result skips this step instead of
#              running it, with the reason (screens-publish publishes no catalogue that failed)
#   timeout    e.g. "90m", a hard limit (then killed; never retried by itself); a build-phase command
#              without one gets [defaults] timeout. retries: re-runs on any failure before it
#              counts as failed (infrastructure failures retry by themselves: [concurrency])
#   capped     true: counts toward [concurrency] max_heavy although it is not heavy itself
#   scratch    publish steps: what runs instead when the target is scratch (a builtin name)
#   A step may leave links.json ([{label, url}]) and notice.json ({title, detail, expects}) in
#              {stage}: tools/rel adds the links to the live message and sends the notice once.
#   reuse      repo paths the step's result depends on ("!path" leaves part of a folder out): an
#              earlier run's passing result with the same content (and env, outputs, version) is
#              reused instead of running the step (tools/rellib/reuse.py); reuse_green = true also
#              takes any green `tools/check.sh --full` on a clean tree of such a commit
#              (/tmp/epic-build/green/<sha>.json)
#
# Placeholders: {version} {commit} {short} {run_id} {run} {files} {extra} {stage} {src}
# {variant} {notor} ("" or "-notor") {tor} ("1" or "0") {github} ("1" when publish.github is on, else "0")
# {play_promote} (release.toml stores.play_promote, e.g. "beta", or "")
# {previous_dir} {previous_version}
# {previous_ref} {target} {scratch} {notes_file} {manifests}
# {rel} (the checkout tools/rel runs from: its step scripts)
# {host.<role>.<key>} {path.<key>} (both from release-hosts.toml).

[defaults]
state_root = "/tmp/epic-build/rel"
heavy_wrap = ["build-slot"]
min_free_gb = 30
# The hard limit of a build-phase command step that sets no `timeout` of its own.
timeout = "180m"

# The signed update manifests (update.json, update-v2.json; WAL-01). validity_days is how long a
# signed manifest is valid (expires_at - issued_at), for a release, a rollback and
# `tools/rel resign`; clients accept at most 400 (btlabs-public FORMAT.md section 5). 45 days
# with a `tools/rel resign` once a month (the owner, 2026-10-31): a frozen or stalled feed goes stale
# within weeks (docs/RELEASING.md, "Re-signing the live manifests"). warn_days: G1 and
# `tools/rel doctor` warn when the live manifest expires sooner than that.
[manifest]
validity_days = 45
warn_days = 14

[relmsg]
bin = "relmsg"
title = "Epic Wallet"

# The gate watcher (tools/rellib/gatewatch.py): once the publish or rollback gate waits, it checks
# every watch_every seconds and runs `tools/rel publish` as soon as the owner approves; it gives up
# after watch_hours without a decision.
[gate]
watch_every = 60
watch_hours = 72

# How a run shares this machine (tools/rellib/window.py; docs/RELEASING.md, "Sharing the
# machine"). max_heavy: heavy steps at once (heavy or capped); `tools/rel start|resume|sign
# --max-heavy N` changes it for a run. apart: pairs that never run together. apart_shared: pairs
# kept apart only while agents share the machine (shared). A step kept apart from source-check also
# waits up to external_wait while a build-slot slot runs one of external_suites. infra_retries:
# automatic retries of a failure caused by the machine (a signal, an ssh drop, no build slot);
# product failures never retry.
# window_marker: the release window file build-slot reads (default
# $XDG_RUNTIME_DIR/wfe-release-window, i.e. /run/user/<uid>/wfe-release-window).
[concurrency]
max_heavy = 2
shared = true
apart = []
apart_shared = []
external_suites = ["check.sh --full", "flutter-test-all", "source-check.sh"]
external_wait = "60m"
infra_retries = 1

# When sign-android asks for the owner's code. The signer binds the code to the exact bytes, so it
# can only be asked once every build is in. "on-demand": the step then waits (exit 10) while the
# other lanes go on, the owner gets one message, and `tools/rel sign` asks when he is ready (two runs
# lost 1,804 s each to a code that did not come in the 35 min a request waits). "inline": ask at
# once and wait for it (`tools/rel start --sign-inline` does that for one run).
[sign]
when = "on-demand"

# ---- hosted builds ---------------------------------------------------------------------------
# `tools/rel start --builds hosted`: build-android, build-linux and build-windows (the steps with a
# `hosted` key) build on GitHub runners from the published twin of the release commit, and
# build-fetch takes their files back after it verifies them (tools/rellib/hosted.py). One dispatch
# per run, no retry, no local fallback: a failed or late build fails its step. {build_id} (WFE_BUILD_ID,
# the About line, local and hosted builds) is the published short commit, else the local one.
[hosted]
repo = "BTLabsUK/wallet-for-epic"
workflow = "build.yml"
gh_config = "~/.config/gh-btlabs"
account = "btlabs-uk"
commit_map = "~/publish/wallet-for-epic.commit-map"
# One JSON line per dispatch; the cap counts the last 24 h.
state = "/tmp/epic-build/rel/hosted-dispatches.jsonl"
max_per_day = 8
ramp_until = "2026-11-10"
ramp_max_per_day = 2
poll = "30s"
# Builds go out in waves; each wave is one dispatch and counts toward the cap. One wave: every build
# in one dispatch (the owner 2026-11-03, 26.11.0). [["tor"], ["notor"]] sends the Tor builds first and
# the no-Tor builds only once every Tor build is in (fetched and verified); a failed Tor build stops
# it there.
waves = [["tor", "notor"]]

# From the dispatch to the files, per platform. The workflow's own job timeouts (75 min android
# and linux, 90 min windows) fire first.
[hosted.deadline]
android = "90m"
linux = "90m"
windows = "105m"

# ---- common: G0, G1, source, G2 ---------------------------------------------------------------

[step.scope]
title = "G0 scope"
kind = "builtin"
host = "local"

[step.preflight]
title = "G1 preflight"
kind = "builtin"
host = "local"
needs = ["scope"]

[step.source]
title = "Source checkout"
kind = "builtin"
host = "build"
needs = ["preflight"]

[step.source-check]
title = "G2 source gate (tools/check.sh)"
host = "build"
needs = ["source"]
run = "{rel}/tools/rellib/steps/source-check.sh {stage}"
heavy = true
timeout = "120m"
# Skippable only with the owner's reason (`--skip source-check="…"`); the report and the gate message
# then say SKIPPED with it.
skippable = true
# Reused (not run) when an earlier run passed it on the same content of these: the
# app, the bot, the pins and tools/check.sh with what it runs (tools/rellib/reuse.py). The release
# tools are not in it: a change to them alone does not rerun G2, their tests run when they change. A
# candidate that differs from a green commit only by its version (tools/version.sh set) counts as
# that commit (not release/release.toml either: the scope is edited for every release).
reuse = ["app", "bot", "scripts/linux/flutter.version", "tools/check.sh", "tools/env.sh", "tools/version.sh",
         "tools/lepic.sh", "tools/lepic.rev", "tools/lepic-flutter.rev", "tools/check-install-contract.sh",
         "tools/install_contract.py", "tools/install-contract.json", "docs/install-contract.md",
         "tools/check-no-hosts.sh", "tools/no_hosts.py", "tools/no-hosts.allow"]
# Any green `tools/check.sh --full` (full and full-notor) on a clean tree with this content (a
# person's on the candidate). Without one G2 runs in the run, and nothing builds or
# dispatches before it passed.
reuse_green = true

[step.hosted-dispatch]
title = "Hosted builds dispatch"
kind = "builtin"
host = "local"
when = ["builds.hosted"]
# Never before G2 passed (26.11.2 run-2 spent two dispatches on a red G2).
needs = ["source", "source-check"]

# ---- release: the builds -----------------------------------------------------------------------

[step.build-android]
title = "Android APK ({variant})"
platform = "android"
for_each = "variant"
# Without a signer Android is signed inside the Gradle build, so it runs where the release key
# is; with one it builds unsigned (tool/build_android_release.sh) and sign-android signs it.
host = "signer"
needs = ["source", "source-check", "hosted-dispatch"]
hosted = "android"
run = "app/tool/build_android_release.sh {stage}"
env = { WFE_TOR = "{tor}", WFE_EMULATOR_X86_64 = "1", WFE_BUILD_ID = "{build_id}" }
heavy = true
outputs = ["bt-wallet-{version}{notor}-android-arm64-v8a.apk"]
extras = ["emulator/bt-wallet-{version}{notor}-android-x86_64.apk"]
timeout = "120m"
# The app without its tests and side tools, the build script and the tools it calls, the pins.
reuse = ["app", "!app/test", "!app/integration_test", "!app/tool", "app/tool/build_android_release.sh",
         "scripts/linux/flutter.version", "tools/env.sh", "tools/version.sh", "tools/lepic.sh", "tools/lepic.rev",
         "tools/lepic-flutter.rev", "tools/build-tor-android.sh", "tools/tor-src.json", "tools/fetch-tor.sh",
         "tools/tor-bundle.json", "tools/dist-check.sh"]

# Play takes one bundle per version code: the build with Tor, as every Play upload since 26.10.20.
# (Two variants with the same version code would make the second upload fail.)
[step.build-play]
title = "Google Play bundle ({variant})"
platform = "android"
when = ["stores.play"]
for_each = "variant"
variants = ["tor"]
host = "signer"
needs = ["build-android"]
run = "app/tool/build_android_release.sh {stage}"
env = { WFE_TOR = "{tor}", WFE_DIST = "play", WFE_BUILD_ID = "{build_id}" }
heavy = true
extras = ["bt-wallet-{version}{notor}-play-android.aab"]
timeout = "120m"

# With a signer ([host.signer] endpoint, docs/RELEASING.md "Signer") the builds are unsigned and
# this signs every Android file of the run (APKs, emulator APKs, the Play bundle) in one request
# The owner approves with one code; G3 then takes the signed bytes (signed.json). With manifests in
# the run that request also declares them, and the manifests step signs them on the same code
# (one code per release, the owner 2026-10-31): so it waits for every build the manifests and G3
# name, and the follow-up comes within minutes. Without a signer the builds signed themselves
# and this only checks the certificate. Its own lane: it may wait 30 min.
[step.sign-android]
title = "Android signing"
kind = "builtin"
host = "local"
platform = "android"
lane = "sign"
needs = ["build-android", "build-play", "build-linux", "build-windows", "apple-mac-check", "ios-testflight",
         "apple-adhoc-mac", "apple-adhoc-ios"]

[step.build-linux]
title = "Linux AppImage ({variant})"
platform = "linux"
for_each = "variant"
host = "build"
# Its own lane, beside the Android builds (the owner 2026-10-30): it builds in its own container from
# its own copy of the code. Each build still takes a build-slot slot (heavy = true); the two
# Linux variants one after the other. metrics.jsonl has the pair's peak memory ("overlap" lines).
lane = "build-linux"
needs = ["source", "source-check", "hosted-dispatch"]
hosted = "linux"
run = "scripts/build-linux.sh && mv -f build-linux/bt-wallet-{version}{notor}-linux-x86_64.AppImage {stage}/"
env = { WFE_TOR = "{tor}", WFE_NODE_BIN = "{path.node_bin_linux}", WFE_BUILD_ID = "{build_id}" }
heavy = true
outputs = ["bt-wallet-{version}{notor}-linux-x86_64.AppImage"]
timeout = "120m"
# The app without its tests and side tools, the container build (scripts/), the tools it calls.
reuse = ["app", "!app/test", "!app/integration_test", "!app/tool", "scripts", "tools/env.sh", "tools/version.sh",
         "tools/lepic.rev", "tools/lepic-flutter.rev", "tools/fetch-tor.sh", "tools/tor-bundle.json"]

[step.build-windows]
title = "Windows installer ({variant})"
platform = "windows"
for_each = "variant"
host = "windows"
# The variants build side by side, each in its own work dir (the owner 2026-10-31: the Windows
# machine takes 4-6 jobs).
lane = "build-windows-{variant}"
needs = ["source", "source-check", "hosted-dispatch"]
hosted = "windows"
# A fresh work dir per run, commit and variant on the Windows machine (never a stale LEPIC blob or
# build tree from an older run: run ids come back after a cleanup, and 26.10.26-run3 once built on
# a 10/31 tree that still named epic_wallet); only this run's installer is taken back.
run = "app/tool/build_windows_release_remote.sh {host.windows.ssh} {host.windows.workdir}/{run_id}-{short}-{variant} && mv -f build-windows/bt-wallet-{version}{notor}-windows-x64-setup.exe {stage}/"
# LEPIC's cargo target per variant, outside the run's work dir and kept between releases (the owner
# 2026-11-02): the two variants never wait on one target's lock, and a new release starts warm.
env = { WFE_TOR = "{tor}", WFE_NODE_BIN_WIN = "{path.node_bin_windows}", WFE_BUILD_ID = "{build_id}", WFE_CARGO_TARGET = "{host.windows.workdir}/cargo-target/{variant}" }
outputs = ["bt-wallet-{version}{notor}-windows-x64-setup.exe"]
timeout = "150m"
# The app without its tests and side tools, the two build scripts, the tools and pins they read
# (the Windows toolchain lives on that machine), as for the other builds.
reuse = ["app", "!app/test", "!app/integration_test", "!app/tool", "app/tool/build_windows_release.ps1",
         "app/tool/build_windows_release_remote.sh", "tools/lepic.rev", "tools/lepic-flutter.rev",
         "tools/fetch-tor.sh", "tools/tor-bundle.json"]

# Apple (tools/apple-release.md): the Mac builds, signs with Developer ID, notarises and staples
# (Xcode's automatic signing). Hand-off steps write a job for the Mac and wait for its results,
# or, for the steps in [host.apple] auto, run it there over ssh (steps/apple-remote.sh);
# Linux then checks the Mac's report before anything can ship. tools/apple-sign.sh (signing on
# Linux) is the backup route only, not in this graph.
[step.apple-mac]
title = "macOS signed + notarised dmg ({variant})"
kind = "handoff"
platform = "macos"
when = ["apple.signed"]
for_each = "variant"
host = "apple"
needs = ["source", "source-check"]
run = "rm -rf src out results && mkdir results && git clone -q job/wfe.bundle src && cd src && git checkout -q --detach {commit} && RELEASE_COMMIT={commit} RELEASE_VERSION={version} WFE_TOR={tor} APPLE_OUT=$PWD/../out tools/build-apple.sh mac-release && cd ../out/mac-release && cp bt-wallet-{version}{notor}-macos.dmg bt-wallet-{version}{notor}-macos.dmg.sha256 bt-wallet-{version}{notor}-macos.REPORT.txt ../../results/ && cd ../../results && shasum -a 256 bt-wallet-* > SHA256SUMS  # in the folder holding job/: a fresh clone beside job/ (release-check refuses untracked files); the three files and SHA256SUMS end up in results/ beside job/. With [host.apple] ssh and auto, tools/rel runs this on the Mac itself (steps/apple-remote.sh)"
results = ["bt-wallet-{version}{notor}-macos.dmg", "bt-wallet-{version}{notor}-macos.dmg.sha256", "bt-wallet-{version}{notor}-macos.REPORT.txt"]
timeout = "48h"

[step.apple-mac-check]
title = "macOS dmg check: sha256, commit, Team ID, Gatekeeper ({variant})"
platform = "macos"
when = ["apple.signed"]
for_each = "variant"
host = "local"
needs = ["apple-mac@variant"]
run = "{rel}/tools/rellib/steps/apple-mac-check.sh {run}/handoff/apple-mac-{variant}/results bt-wallet-{version}{notor}-macos.dmg {commit} \"{host.apple.team_id}\" {stage}"
outputs = ["bt-wallet-{version}{notor}-macos.dmg"]

# iOS goes to TestFlight from Xcode (Archive → Distribute → App Store Connect): nothing is
# published from here. Only the build without Tor. The builder writes REPORT.txt by hand (the
# build number and "uploaded").
[step.ios-testflight]
title = "iOS to TestFlight"
kind = "handoff"
platform = "ios"
when = ["apple.signed"]
host = "apple"
needs = ["source", "source-check"]
run = "git fetch job/wfe.bundle HEAD && git checkout --detach FETCH_HEAD && test \"$(git rev-parse HEAD)\" = {commit} && RELEASE_COMMIT={commit} RELEASE_VERSION={version} WFE_TOR=0 WFE_DIST=appstore tools/build-apple.sh ios-prepare  # then Xcode Archive → Distribute → App Store Connect; results/REPORT.txt: build number + uploaded"
results = ["REPORT.txt"]
timeout = "48h"

# Apple ad hoc (release.toml [apple] signed = false, --set apple.signed=false): what 26.10.24
# shipped, for test releases without the team's signing set-up. One Mac build per variant gives
# the ad-hoc-signed .dmg (not notarised: Gatekeeper asks the user to open it by hand); the one
# without Tor also gives the unsigned .ipa (a device install needs it signed first). iOS cannot
# run Tor, so there is one iOS file per release, bt-wallet-<version>-notor-ios-unsigned.ipa, and
# build-apple.sh refuses an iOS build with Tor. Linux checks the Mac's results.txt (release-check
# at the commit, every step PASS) and the SHA256SUMS before any file can ship.
[step.apple-adhoc]
title = "Apple ad-hoc dmg + unsigned ipa ({variant})"
kind = "handoff"
platform = ["macos", "ios"]
unless = ["apple.signed"]
for_each = "variant"
host = "apple"
needs = ["source", "source-check"]
run = "rm -rf src out && git clone -q job/wfe.bundle src && cd src && git checkout -q --detach {commit} && RELEASE_COMMIT={commit} RELEASE_VERSION={version} WFE_TOR={tor} APPLE_OUT=$PWD/../out tools/build-apple.sh release-check doctor sources lepic macos dmg ipa  # in the folder holding job/: a fresh clone beside job/ (release-check refuses untracked files, and a build changes tracked ones); then out/{bt-wallet-{version}{notor}-macos.dmg,bt-wallet-{version}{notor}-ios-unsigned.ipa,results.txt} into results/ with their SHA256SUMS"
results = ["bt-wallet-{version}{notor}-macos.dmg", "bt-wallet-{version}{notor}-ios-unsigned.ipa", "results.txt", "SHA256SUMS"]
timeout = "48h"
[step.apple-adhoc.by_variant.tor]
title = "Apple ad-hoc dmg (tor)"
run = "rm -rf src out && git clone -q job/wfe.bundle src && cd src && git checkout -q --detach {commit} && RELEASE_COMMIT={commit} RELEASE_VERSION={version} WFE_TOR={tor} APPLE_OUT=$PWD/../out tools/build-apple.sh release-check doctor sources lepic macos dmg  # in the folder holding job/: a fresh clone beside job/ (release-check refuses untracked files, and a build changes tracked ones); then out/{bt-wallet-{version}-macos.dmg,results.txt} into results/ with their SHA256SUMS. No ipa: iOS is only built without Tor"
results = ["bt-wallet-{version}-macos.dmg", "results.txt", "SHA256SUMS"]

[step.apple-adhoc-mac]
title = "macOS ad-hoc dmg check: sums, commit, steps ({variant})"
platform = "macos"
unless = ["apple.signed"]
for_each = "variant"
host = "local"
needs = ["apple-adhoc@variant"]
run = "{rel}/tools/rellib/steps/apple-adhoc-check.sh {run}/handoff/apple-adhoc-{variant}/results bt-wallet-{version}{notor}-macos.dmg {commit} {version} {stage}"
outputs = ["bt-wallet-{version}{notor}-macos.dmg"]

[step.apple-adhoc-ios]
title = "iOS unsigned ipa check: sums, commit, steps"
platform = "ios"
unless = ["apple.signed"]
for_each = "variant"
variants = ["notor"]
host = "local"
needs = ["apple-adhoc@variant"]
run = "{rel}/tools/rellib/steps/apple-adhoc-check.sh {run}/handoff/apple-adhoc-{variant}/results bt-wallet-{version}{notor}-ios-unsigned.ipa {commit} {version} {stage}"
outputs = ["bt-wallet-{version}{notor}-ios-unsigned.ipa"]

# ---- release: screens, beside the builds (docs/RELEASING.md, "Screens") -----------------------

# The screen catalogue (tools/screens.sh --candidate) of this release's own source, from when G2
# passed, in its own lane beside the builds: each tour's flutter test takes a build-slot
# slot like a build (the step itself is not heavy, or it would hold a slot while it waits for
# them). `latest` stays on the published release until screens-publish. Reuses the catalogue when
# its content key is unchanged. warn_only: a failed render holds nothing, neither a build nor the
# gate; screens-publish then publishes nothing. It renders in the release checkout,
# so it waits for the builds made there: a tour's `flutter test` rewrites the generated plugin
# registrants with the dev plugins, and an Android build compiling meanwhile fails on
# integration_test (26.10.25 run-15).
[step.screens]
title = "Screen catalogue (render)"
host = "build"
lane = "screens"
warn_only = true
skippable = true
capped = true
needs = ["source", "source-check", "build-android", "build-play", "build-linux"]
run = "{rel}/tools/rellib/steps/screens.sh {version} {stage}"
timeout = "120m"

# ---- release: G3, manifests, G4 manifest checks ------------------------------------------------

[step.artefacts]
title = "G3 artefacts"
kind = "builtin"
host = "local"
needs = ["build-android", "sign-android", "build-linux", "build-windows", "apple-mac-check", "ios-testflight",
         "apple-adhoc-mac", "apple-adhoc-ios"]

[step.manifests]
title = "Update manifests (signed)"
host = "signer"
when = ["publish.manifests"]
needs = ["artefacts"]
run = "{rel}/tools/rellib/steps/manifests.sh"
outputs = []

[step.trust-manifest]
title = "G4 manifest signature checks"
kind = "builtin"
host = "local"
when = ["publish.manifests"]
needs = ["manifests"]

# ---- release: G5 -------------------------------------------------------------------------------

[step.publish-gate]
title = "G5 publish gate"
kind = "gate"
host = "local"
needs = ["artefacts", "trust-manifest"]

# ---- publish, in fixed order: tag -> downloads -> page -> source -> manifests last --------------

# The release tag v<version> (v<version>-rN for a rebuild) on the release commit, which must be on
# main or on release/<version> (then merged into main first); local only, pushed by publish-source. TEST runs and the scratch target make none.
[step.tag]
title = "Release tag"
host = "build"
publish = true
needs = ["publish-gate"]
run = "{rel}/tools/rellib/steps/tag.sh {version} {commit} {path.main_checkout} {stage}"

[step.publish-downloads]
title = "Publish downloads"
kind = "publish"
host = "web"
needs = ["tag"]
run = "{rel}/tools/rellib/steps/publish-downloads.sh {files} {host.web.ssh} {host.web.downloads_dir}"
scratch = "scratch_downloads"

[step.publish-page]
title = "Publish release page"
kind = "publish"
host = "web"
needs = ["publish-downloads"]
skippable = true
run = "{rel}/tools/rellib/steps/publish-page.sh {version} {files} {path.page_repo} {path.main_checkout}"
# publish.github on: the page links the GitHub Release (build.py add --github).
env = { REL_GITHUB = "{github}" }
scratch = "scratch_page"

[step.publish-source]
title = "Publish source"
kind = "publish"
host = "build"
needs = ["publish-page"]
skippable = true
run = "cd {path.main_checkout} && tools/publish-github.sh --push --ref {commit}"
# To github.com/BTLabsUK, tag included, where publish-github-release needs it: main up to the
# release commit and no further. What main has after it goes out with the next release.
scratch = "scratch_source"

# The GitHub Release of tag v{version}: every published file as an asset, marked latest, so
# github.com/BTLabsUK/wallet-for-epic/releases/latest/download/<name> serves the newest. A mirror:
# BT Labs' server stays the primary source. On a failure `tools/rel skip publish-github-release
# --reason ...` lets the manifests go out without it.
[step.publish-github-release]
title = "Publish GitHub release (mirror)"
kind = "publish"
host = "signer"
when = ["publish.github"]
needs = ["publish-source"]
skippable = true
retries = 1
run = "{rel}/tools/rellib/steps/publish-github-release.sh {version} {files} {stage}"
scratch = "scratch_noop"

[step.publish-manifests]
title = "Publish update manifests (the switch)"
kind = "publish"
host = "signer"
when = ["publish.manifests"]
needs = ["publish-downloads", "publish-page", "publish-source", "publish-github-release"]
run = "tools/publish-update-json.sh {manifests}/update.json {manifests}/update-v2.json"
# publish.github on: update-v2.json also onto the latest GitHub Release (never a gate).
env = { GITHUB_UPDATE_JSON = "{github}" }
scratch = "scratch_manifests"

[step.verify-live]
title = "G6 read back"
kind = "builtin"
host = "local"
publish = true
needs = ["publish-manifests", "publish-downloads", "publish-page"]

[step.prune-downloads]
title = "Prune older downloads"
kind = "publish"
host = "web"
skippable = true
needs = ["verify-live"]
run = "{rel}/tools/rellib/steps/prune-downloads.sh {version} {host.web.ssh} {host.web.downloads_dir} {previous_dir} {manifests}"
scratch = "scratch_prune"

[step.store-play]
title = "Google Play upload (internal)"
kind = "publish"
platform = "android"
when = ["stores.play"]
for_each = "variant"
variants = ["tor"]
host = "signer"
skippable = true
needs = ["verify-live", "build-play@variant"]
run = "tools/play-upload.sh {run}/extra/bt-wallet-{version}{notor}-play-android.aab --track internal --notes-file {notes_file}"
scratch = "scratch_noop"

# Then the same bundle onto a testing track after internal (stores.play_promote, e.g. "beta"), as
# 26.10.24 went to the open beta; production stays a click in Play Console.
[step.store-play-promote]
title = "Google Play: internal to the next testing track"
kind = "publish"
platform = "android"
when = ["stores.play", "stores.play_promote"]
host = "signer"
skippable = true
needs = ["store-play"]
run = "tools/play-upload.sh --promote {play_promote} --notes-file {notes_file}"
scratch = "scratch_noop"

# The release is live: its catalogue (step screens, before the gate) becomes `latest` and the
# public gallery https://epiccash.btlabs.uk/screens/ (tools/screens-publish.sh), as every release
# did by hand up to 26.10.23. A TEST run builds the public copy only. Never holds the release: it
# runs once screens is done, and is skipped when screens failed or was skipped (needs_ok).
[step.screens-publish]
title = "Screen gallery (publish)"
host = "build"
lane = "screens"
publish = true
warn_only = true
skippable = true
needs = ["verify-live", "screens"]
needs_ok = ["screens"]
run = "{rel}/tools/rellib/steps/screens-publish.sh {version} {stage}"
timeout = "60m"

# The draft Telegram post, from the version's changelog entry, sent to the owner to edit and post (the
# lead's telegram-<version>.txt up to 26.10.23). Posts nothing. A failure is a warning.
[step.announce]
title = "Telegram post (draft for the owner)"
host = "local"
publish = true
warn_only = true
skippable = true
needs = ["verify-live"]
run = "{rel}/tools/rellib/steps/announce.py {version} {path.page_repo} {stage}"

# Q-DEL (the owner's yes, 2026-10-31): once a release signed through the signer is live, ask him
# to delete the key copies on the build machine (docs/RELEASING.md, Signer). Deletes nothing itself; asks
# nothing in a run without the signer or once the files are gone. A failure is a warning.
[step.key-copies]
title = "Key copies on the build machine (ask the owner)"
host = "local"
publish = true
warn_only = true
skippable = true
needs = ["verify-live"]
run = "{rel}/tools/rellib/steps/key-copies.sh {stage}"

[step.cleanup]
title = "Cleanup (keep the previous release only)"
kind = "builtin"
host = "local"
publish = true
skippable = true
# After every step that still reads the release worktree (screens-publish runs its tools).
needs = ["verify-live", "prune-downloads", "store-play", "store-play-promote", "screens-publish", "announce", "key-copies"]
