[step.hosted-dispatch]
title = "Hosted builds dispatch"
kind = "builtin"
host = "local"
when = ["builds.hosted"]
# Never before G2 passed (26.11.2 run-2 spent two dispatches on a red G2).
needs = ["source", "source-check"]

# ---- release: the builds -----------------------------------------------------------------------

[step.build-android]
title = "Android APK ({variant})"
platform = "android"
for_each = "variant"
# Without a signer Android is signed inside the Gradle build, so it runs where the release key
# is; with one it builds unsigned (tool/build_android_release.sh) and sign-android signs it.
host = "signer"
needs = ["source", "source-check", "hosted-dispatch"]
hosted = "android"
run = "app/tool/build_android_release.sh {stage}"
env = { WFE_TOR = "{tor}", WFE_EMULATOR_X86_64 = "1", WFE_BUILD_ID = "{build_id}" }
heavy = true
outputs = ["bt-wallet-{version}{notor}-android-arm64-v8a.apk"]
extras = ["emulator/bt-wallet-{version}{notor}-android-x86_64.apk"]
timeout = "120m"
# The app without its tests and side tools, the build script and the tools it calls, the pins.
reuse = ["app", "!app/test", "!app/integration_test", "!app/tool", "app/tool/build_android_release.sh",
         "scripts/linux/flutter.version", "tools/env.sh", "tools/version.sh", "tools/lepic.sh", "tools/lepic.rev",
         "tools/lepic-flutter.rev", "tools/build-tor-android.sh", "tools/tor-src.json", "tools/fetch-tor.sh",
         "tools/tor-bundle.json", "tools/dist-check.sh"]

# Play takes one bundle per version code: the build with Tor, as every Play upload since 26.10.20.
# (Two variants with the same version code would make the second upload fail.)
[step.build-play]
title = "Google Play bundle ({variant})"
platform = "android"
when = ["stores.play"]
for_each = "variant"
variants = ["tor"]
host = "signer"
needs = ["build-android"]
run = "app/tool/build_android_release.sh {stage}"
env = { WFE_TOR = "{tor}", WFE_DIST = "play", WFE_BUILD_ID = "{build_id}" }
heavy = true
extras = ["bt-wallet-{version}{notor}-play-android.aab"]
timeout = "120m"

# With a signer ([host.signer] endpoint, docs/RELEASING.md "Signer") the builds are unsigned and
# this signs every Android file of the run (APKs, emulator APKs, the Play bundle) in one request
# The owner approves with one code; G3 then takes the signed bytes (signed.json). With manifests in
# the run that request also declares them, and the manifests step signs them on the same code
# (one code per release, the owner 2026-10-31): so it waits for every build the manifests and G3
# name, and the follow-up comes within minutes. Without a signer the builds signed themselves
# and this only checks the certificate. Its own lane: it may wait 30 min.
[step.sign-android]
title = "Android signing"
kind = "builtin"
host = "local"
platform = "android"
lane = "sign"
needs = ["build-android", "build-play", "build-linux", "build-windows", "apple-mac-check", "ios-testflight",
         "apple-adhoc-mac", "apple-adhoc-ios"]

[step.build-linux]
title = "Linux AppImage ({variant})"
platform = "linux"
for_each = "variant"
host = "build"
# Its own lane, beside the Android builds (the owner 2026-10-30): it builds in its own container from
# its own copy of the code. Each build still takes a build-slot slot (heavy = true); the two
# Linux variants one after the other. metrics.jsonl has the pair's peak memory ("overlap" lines).
lane = "build-linux"
needs = ["source", "source-check", "hosted-dispatch"]
hosted = "linux"
run = "scripts/build-linux.sh && mv -f build-linux/bt-wallet-{version}{notor}-linux-x86_64.AppImage {stage}/"
env = { WFE_TOR = "{tor}", WFE_NODE_BIN = "{path.node_bin_linux}", WFE_BUILD_ID = "{build_id}" }
heavy = true
outputs = ["bt-wallet-{version}{notor}-linux-x86_64.AppImage"]
timeout = "120m"
# The app without its tests and side tools, the container build (scripts/), the tools it calls.
reuse = ["app", "!app/test", "!app/integration_test", "!app/tool", "scripts", "tools/env.sh", "tools/version.sh",
         "tools/lepic.rev", "tools/lepic-flutter.rev", "tools/fetch-tor.sh", "tools/tor-bundle.json"]

[step.build-windows]
title = "Windows installer ({variant})"
platform = "windows"
for_each = "variant"
host = "windows"
# The variants build side by side, each in its own work dir (the owner 2026-10-31: the Windows
# machine takes 4-6 jobs).
lane = "build-windows-{variant}"
needs = ["source", "source-check", "hosted-dispatch"]
hosted = "windows"
# A fresh work dir per run, commit and variant on the Windows machine (never a stale LEPIC blob or
# build tree from an older run: run ids come back after a cleanup, and 26.10.26-run3 once built on
# a 10/31 tree that still named epic_wallet); only this run's installer is taken back.
run = "app/tool/build_windows_release_remote.sh {host.windows.ssh} {host.windows.workdir}/{run_id}-{short}-{variant} && mv -f build-windows/bt-wallet-{version}{notor}-windows-x64-setup.exe {stage}/"
# LEPIC's cargo target per variant, outside the run's work dir and kept between releases (the owner
# 2026-11-02): the two variants never wait on one target's lock, and a new release starts warm.
env = { WFE_TOR = "{tor}", WFE_NODE_BIN_WIN = "{path.node_bin_windows}", WFE_BUILD_ID = "{build_id}", WFE_CARGO_TARGET = "{host.windows.workdir}/cargo-target/{variant}" }
outputs = ["bt-wallet-{version}{notor}-windows-x64-setup.exe"]
timeout = "150m"
# The app without its tests and side tools, the two build scripts, the tools and pins they read
# (the Windows toolchain lives on that machine), as for the other builds.
reuse = ["app", "!app/test", "!app/integration_test", "!app/tool", "app/tool/build_windows_release.ps1",
         "app/tool/build_windows_release_remote.sh", "tools/lepic.rev", "tools/lepic-flutter.rev",
         "tools/fetch-tor.sh", "tools/tor-bundle.json"]

# Apple (tools/apple-release.md): the Mac builds, signs with Developer ID, notarises and staples
# (Xcode's automatic signing). Hand-off steps write a job for the Mac and wait for its results;
# Linux then checks the Mac's report before anything can ship. tools/apple-sign.sh (signing on
# Linux) is the backup route only, not in this graph.
[step.apple-mac]
title = "macOS signed + notarised dmg ({variant})"
kind = "handoff"
platform = "macos"
when = ["apple.signed"]
for_each = "variant"
host = "apple"
needs = ["source", "source-check"]
run = "git fetch job/wfe.bundle HEAD && git checkout --detach FETCH_HEAD && test \"$(git rev-parse HEAD)\" = {commit} && RELEASE_COMMIT={commit} RELEASE_VERSION={version} WFE_TOR={tor} tools/build-apple.sh mac-release  # then build-apple/{variant}/mac-release/bt-wallet-{version}{notor}-macos.{dmg,dmg.sha256,REPORT.txt} into results/"
results = ["bt-wallet-{version}{notor}-macos.dmg", "bt-wallet-{version}{notor}-macos.dmg.sha256", "bt-wallet-{version}{notor}-macos.REPORT.txt"]
timeout = "48h"

[step.apple-mac-check]
title = "macOS dmg check: sha256, commit, Team ID, Gatekeeper ({variant})"
platform = "macos"
when = ["apple.signed"]
for_each = "variant"
host = "local"
needs = ["apple-mac@variant"]
run = "{rel}/tools/rellib/steps/apple-mac-check.sh {run}/handoff/apple-mac-{variant}/results bt-wallet-{version}{notor}-macos.dmg {commit} \"{host.apple.team_id}\" {stage}"
outputs = ["bt-wallet-{version}{notor}-macos.dmg"]

# iOS goes to TestFlight from Xcode (Archive → Distribute → App Store Connect): nothing is
# published from here. Only the build without Tor. The builder writes REPORT.txt by hand (the
# build number and "uploaded").
[step.ios-testflight]
title = "iOS to TestFlight"
kind = "handoff"
platform = "ios"
when = ["apple.signed"]
host = "apple"
needs = ["source", "source-check"]
run = "git fetch job/wfe.bundle HEAD && git checkout --detach FETCH_HEAD && test \"$(git rev-parse HEAD)\" = {commit} && RELEASE_COMMIT={commit} RELEASE_VERSION={version} WFE_TOR=0 WFE_DIST=appstore tools/build-apple.sh ios-prepare  # then Xcode Archive → Distribute → App Store Connect; results/REPORT.txt: build number + uploaded"
results = ["REPORT.txt"]
timeout = "48h"

# Apple ad hoc (release.toml [apple] signed = false, --set apple.signed=false): what 26.10.24
# shipped, for test releases without the team's signing set-up. One Mac build per variant gives
# the ad-hoc-signed .dmg (not notarised: Gatekeeper asks the user to open it by hand); the one
# without Tor also gives the unsigned .ipa (a device install needs it signed first). iOS cannot
# run Tor, so there is one iOS file per release, bt-wallet-<version>-notor-ios-unsigned.ipa, and
# build-apple.sh refuses an iOS build with Tor. Linux checks the Mac's results.txt (release-check
# at the commit, every step PASS) and the SHA256SUMS before any file can ship.
[step.apple-adhoc]
title = "Apple ad-hoc dmg + unsigned ipa ({variant})"
kind = "handoff"
platform = ["macos", "ios"]
unless = ["apple.signed"]
for_each = "variant"
host = "apple"
needs = ["source", "source-check"]
run = "rm -rf src out && git clone -q job/wfe.bundle src && cd src && git checkout -q --detach {commit} && RELEASE_COMMIT={commit} RELEASE_VERSION={version} WFE_TOR={tor} APPLE_OUT=$PWD/../out tools/build-apple.sh release-check doctor sources lepic macos dmg ipa  # in the folder holding job/: a fresh clone beside job/ (release-check refuses untracked files, and a build changes tracked ones); then out/{bt-wallet-{version}{notor}-macos.dmg,bt-wallet-{version}{notor}-ios-unsigned.ipa,results.txt} into results/ with their SHA256SUMS"
results = ["bt-wallet-{version}{notor}-macos.dmg", "bt-wallet-{version}{notor}-ios-unsigned.ipa", "results.txt", "SHA256SUMS"]
timeout = "48h"
[step.apple-adhoc.by_variant.tor]
title = "Apple ad-hoc dmg (tor)"
run = "rm -rf src out && git clone -q job/wfe.bundle src && cd src && git checkout -q --detach {commit} && RELEASE_COMMIT={commit} RELEASE_VERSION={version} WFE_TOR={tor} APPLE_OUT=$PWD/../out tools/build-apple.sh release-check doctor sources lepic macos dmg  # in the folder holding job/: a fresh clone beside job/ (release-check refuses untracked files, and a build changes tracked ones); then out/{bt-wallet-{version}-macos.dmg,results.txt} into results/ with their SHA256SUMS. No ipa: iOS is only built without Tor"
results = ["bt-wallet-{version}-macos.dmg", "results.txt", "SHA256SUMS"]

[step.apple-adhoc-mac]
title = "macOS ad-hoc dmg check: sums, commit, steps ({variant})"
platform = "macos"
unless = ["apple.signed"]
for_each = "variant"
host = "local"
needs = ["apple-adhoc@variant"]
run = "{rel}/tools/rellib/steps/apple-adhoc-check.sh {run}/handoff/apple-adhoc-{variant}/results bt-wallet-{version}{notor}-macos.dmg {commit} {version} {stage}"
outputs = ["bt-wallet-{version}{notor}-macos.dmg"]

[step.apple-adhoc-ios]
title = "iOS unsigned ipa check: sums, commit, steps"
platform = "ios"
unless = ["apple.signed"]
for_each = "variant"
variants = ["notor"]
host = "local"
needs = ["apple-adhoc@variant"]
run = "{rel}/tools/rellib/steps/apple-adhoc-check.sh {run}/handoff/apple-adhoc-{variant}/results bt-wallet-{version}{notor}-ios-unsigned.ipa {commit} {version} {stage}"
outputs = ["bt-wallet-{version}{notor}-ios-unsigned.ipa"]

# ---- release: screens, beside the builds (docs/RELEASING.md, "Screens") -----------------------

# The screen catalogue (tools/screens.sh --candidate) of this release's own source, from when G2
# passed, in its own lane beside the builds and G4: each tour's flutter test takes a build-slot
# slot like a build (the step itself is not heavy, or it would hold a slot while it waits for
# them). `latest` stays on the published release until screens-publish. Reuses the catalogue when
# its content key is unchanged. warn_only: a failed render never stops a build or a trust run
# mid-way; screens-check turns it into a FAIL before the gate. It renders in the release checkout,
# so it waits for the builds made there: a tour's `flutter test` rewrites the generated plugin
# registrants with the dev plugins, and an Android build compiling meanwhile fails on
# integration_test (26.10.25 run-15).
[step.screens]
title = "Screen catalogue (render)"
host = "build"
lane = "screens"
warn_only = true
skippable = true
capped = true
needs = ["source", "source-check", "build-android", "build-play", "build-linux"]
run = "{rel}/tools/rellib/steps/screens.sh {version} {stage}"
timeout = "120m"

# ---- release: G3, manifests, G4 ----------------------------------------------------------------

[step.artefacts]
title = "G3 artefacts"
kind = "builtin"
host = "local"
needs = ["build-android", "sign-android", "build-linux", "build-windows", "apple-mac-check", "ios-testflight",
         "apple-adhoc-mac", "apple-adhoc-ios"]

[step.manifests]
title = "Update manifests (signed)"
host = "signer"
when = ["publish.manifests"]
needs = ["artefacts"]
run = "{rel}/tools/rellib/steps/manifests.sh"
outputs = []

[step.trust-manifest]
title = "G4 manifest checks"
kind = "builtin"
host = "local"
when = ["publish.manifests"]
needs = ["manifests"]

# G4 checks only what belongs to the release files: install, the previous release updating to this
# one and keeping everything, signing as installed. The flows, the send and receive legs among them
# ([proof] funds_in), passed on the test build the night before the cut.
# Every trust step runs tools/rellib/hermetic/up.sh before its driver ([proof.drivers]) and carries on
# when it exits 1 (the node still syncing): the lanes use this machine's mainnet node and Epicbox relay
# where they are healthy, and public servers for the one live-funds leg (REL_FUNDS) per platform,
# which runs in the night's flow lanes.
# Update trust runs per platform from when this machine's builds are done (no driver competes
# with a build for the CPU), Windows and macOS also after their own build, Android and Linux
# without waiting for them; at most [concurrency] max_heavy at once (Windows runs on its rigs and
# does not count), Windows beside Android (its app runs on the rig), Android never beside a full suite. Each lane has a hard
# limit (Android and Windows 50 min, about 2.5x their slowest pass so far, 1,198 s and 1,280 s;
# Linux 60 min, its slowest was 2,447 s under load); a lane killed by the machine (a signal, no
# proof.json, an ssh drop) runs once more by itself, a product failure or a timeout never. The drivers wait on the chain and on P, not on the CPU, and P's legs
# queue on P's own lock. Each Android variant has its own emulator and makes its own wallet there
# (see trust-android.sh), so the two run at once; each
# Linux variant makes its own wallet in its own sandbox, so they run at once too. G3 and every
# platform's trust still come before the publish gate (update-trust). Whether trust may start
# right after its own build is decided later from metrics.jsonl (per-step load, overlaps,
# emulator health; docs/RELEASING.md).
[step.trust-android]
title = "G4 update trust Android ({variant})"
platform = "android"
for_each = "proof_variant"
host = "build"
lane = "trust-android-{variant}"
needs = ["build-android", "build-play", "sign-android", "build-linux"]
proof = true
timeout = "50m"

[step.trust-linux]
title = "G4 update trust Linux ({variant})"
platform = "linux"
for_each = "proof_variant"
host = "build"
lane = "trust-linux-{variant}"
# No sign-android: the AppImage is not signed one by one (SHA256SUMS.sig covers it), so the
# desktop trust runs need no signature and do not wait for the release's code.
needs = ["build-android", "build-play", "build-linux"]
proof = true
timeout = "60m"

[step.trust-windows]
title = "G4 update trust Windows ({variant})"
platform = "windows"
for_each = "proof_variant"
host = "build"
# A lane per variant, each on its own rig session ([host.windows] rigs in release-hosts.toml,
# e.g. tor = 1, notor = 5; both 1 when unset). Every rig job runs in Windows session 0, so jobs of
# one Windows user share the app's single-instance mutex (Local\uk.btlabs.epiccash.desktop.single)
# and Setup's HKCU uninstall entry: the driver holds a lock per rig user, and two variants whose
# rigs have the same user still run one after the other. Only rigs with different users overlap.
lane = "trust-windows-{variant}"
needs = ["build-android", "build-play", "build-linux", "build-windows@variant"]  # no signature, as Linux
proof = true
# The app runs on the rig; this machine only drives it over ssh (run 26.10.26: local load 1.7-2.75
# during the Windows lanes). It took a heavy slot anyway and waited 2 h behind the Linux lanes, so
# it no longer counts toward max_heavy, and runs beside the Android lanes.
remote = true
timeout = "50m"

[step.trust-macos]
title = "G4 update trust macOS ({variant})"
platform = "macos"
for_each = "proof_variant"
host = "build"
lane = "trust-macos"
needs = ["build-android", "build-play", "sign-android", "build-linux", "apple-mac-check@variant", "apple-adhoc-mac@variant"]
proof = true

[step.trust-ios]
title = "G4 update trust iOS"
platform = "ios"
for_each = "proof_variant"
variants = ["notor"]
host = "build"
lane = "trust-ios"
needs = ["build-android", "build-play", "sign-android", "build-linux", "ios-testflight", "apple-adhoc-ios@variant"]
proof = true

[step.update-trust]
title = "G4 update trust"
kind = "builtin"
host = "local"
needs = ["artefacts", "trust-manifest", "trust-android", "trust-linux", "trust-windows", "trust-macos", "trust-ios"]

# ---- release: screen check, G5 (docs/RELEASING.md, "Screens") ----------------------------------

# The pre-gate screen check (tools/rellib/steps/screens_check.py): tour failures, screens gone vs
# the published release, raw l10n keys, unfilled placeholders, debug text, new hosts / network
# words / error texts on screens, translations the screens need, the visual diff, and the real
# installed-build screens the G4 drivers took (copied into the catalogue's real/). Its summary is
# in the publish-gate message. FAIL findings fail it (fix, or `tools/rel skip screens-check
# --reason ...`); warnings never hold anything. After G4, so a FAIL stops nothing but the gate.
[step.screens-check]
title = "Screen check (before the gate)"
host = "local"
lane = "screens"
skippable = true
needs = ["screens", "update-trust"]
run = "{rel}/tools/rellib/steps/screens_check.py {version} {stage}"
timeout = "30m"

[step.publish-gate]
title = "G5 publish gate"
kind = "gate"
host = "local"
needs = ["update-trust", "screens-check"]

# ---- publish, in fixed order: tag -> downloads -> page -> source -> manifests last --------------

# The release tag v<version> (v<version>-rN for a rebuild) on the release commit, which must be on
# main or on release/<version> (then merged into main first); local only, pushed by publish-source. TEST runs and the scratch target make none.
[step.tag]
title = "Release tag"
host = "build"
publish = true
needs = ["publish-gate"]
run = "{rel}/tools/rellib/steps/tag.sh {version} {commit} {path.main_checkout} {stage}"

[step.publish-downloads]
title = "Publish downloads"
kind = "publish"
host = "web"
needs = ["tag"]
run = "{rel}/tools/rellib/steps/publish-downloads.sh {files} {host.web.ssh} {host.web.downloads_dir}"
scratch = "scratch_downloads"

[step.publish-page]
title = "Publish release page"
kind = "publish"
host = "web"
needs = ["publish-downloads"]
skippable = true
run = "{rel}/tools/rellib/steps/publish-page.sh {version} {files} {path.page_repo} {path.main_checkout}"
# publish.github on: the page links the GitHub Release (build.py add --github).
env = { REL_GITHUB = "{github}" }
scratch = "scratch_page"

[step.publish-source]
title = "Publish source"
kind = "publish"
host = "build"
needs = ["publish-page"]
skippable = true
run = "cd {path.main_checkout} && tools/publish-github.sh --push --ref {commit}"
# To github.com/BTLabsUK, tag included, where publish-github-release needs it: main up to the
# release commit and no further. What main has after it goes out with the next release.
scratch = "scratch_source"

# The GitHub Release of tag v{version}: every published file as an asset, marked latest, so
# github.com/BTLabsUK/wallet-for-epic/releases/latest/download/<name> serves the newest. A mirror:
# BT Labs' server stays the primary source. On a failure `tools/rel skip publish-github-release
# --reason ...` lets the manifests go out without it.
[step.publish-github-release]
title = "Publish GitHub release (mirror)"
kind = "publish"
host = "signer"
when = ["publish.github"]
needs = ["publish-source"]
skippable = true
retries = 1
run = "{rel}/tools/rellib/steps/publish-github-release.sh {version} {files} {stage}"
scratch = "scratch_noop"

[step.publish-manifests]
title = "Publish update manifests (the switch)"
kind = "publish"
host = "signer"
when = ["publish.manifests"]
needs = ["publish-downloads", "publish-page", "publish-source", "publish-github-release"]
run = "tools/publish-update-json.sh {manifests}/update.json {manifests}/update-v2.json"
# publish.github on: update-v2.json also onto the latest GitHub Release (never a gate).
env = { GITHUB_UPDATE_JSON = "{github}" }
scratch = "scratch_manifests"

[step.verify-live]
title = "G6 read back"
kind = "builtin"
host = "local"
publish = true
needs = ["publish-manifests", "publish-downloads", "publish-page"]

[step.prune-downloads]
title = "Prune older downloads"
kind = "publish"
host = "web"
skippable = true
needs = ["verify-live"]
run = "{rel}/tools/rellib/steps/prune-downloads.sh {version} {host.web.ssh} {host.web.downloads_dir} {previous_dir} {manifests}"
scratch = "scratch_prune"

[step.store-play]
title = "Google Play upload (internal)"
kind = "publish"
platform = "android"
when = ["stores.play"]
for_each = "variant"
variants = ["tor"]
host = "signer"
skippable = true
needs = ["verify-live", "build-play@variant"]
run = "tools/play-upload.sh {run}/extra/bt-wallet-{version}{notor}-play-android.aab --track internal --notes-file {notes_file}"
scratch = "scratch_noop"

# Then the same bundle onto a testing track after internal (stores.play_promote, e.g. "beta"), as
# 26.10.24 went to the open beta; production stays a click in Play Console.
[step.store-play-promote]
title = "Google Play: internal to the next testing track"
kind = "publish"
platform = "android"
when = ["stores.play", "stores.play_promote"]
host = "signer"
skippable = true
needs = ["store-play"]
run = "tools/play-upload.sh --promote {play_promote} --notes-file {notes_file}"
scratch = "scratch_noop"

# The release is live: its catalogue (step screens, before the gate) becomes `latest` and the
# public gallery https://epiccash.btlabs.uk/screens/ (tools/screens-publish.sh), as every release
# did by hand up to 26.10.23. A TEST run builds the public copy only. Never holds the release.
[step.screens-publish]
title = "Screen gallery (publish)"
host = "build"
lane = "screens"
publish = true
warn_only = true
skippable = true
needs = ["verify-live"]
run = "{rel}/tools/rellib/steps/screens-publish.sh {version} {stage}"
timeout = "60m"

# The draft Telegram post, from the version's changelog entry, sent to the owner to edit and post (the
# lead's telegram-<version>.txt up to 26.10.23). Posts nothing. A failure is a warning.
[step.announce]
title = "Telegram post (draft for the owner)"
host = "local"
publish = true
warn_only = true
skippable = true
needs = ["verify-live"]
run = "{rel}/tools/rellib/steps/announce.py {version} {path.page_repo} {stage}"

# Q-DEL (the owner's yes, 2026-10-31): once a release signed through the signer is live, ask him
# to delete the key copies on the build machine (docs/RELEASING.md, Signer). Deletes nothing itself; asks
# nothing in a run without the signer or once the files are gone. A failure is a warning.
[step.key-copies]
title = "Key copies on the build machine (ask the owner)"
host = "local"
publish = true
warn_only = true
skippable = true
needs = ["verify-live"]
run = "{rel}/tools/rellib/steps/key-copies.sh {stage}"

[step.cleanup]
title = "Cleanup (keep the previous release only)"
kind = "builtin"
host = "local"
publish = true
skippable = true
# After every step that still reads the release worktree (screens-publish runs its tools).
needs = ["verify-live", "prune-downloads", "store-play", "store-play-promote", "screens-publish", "announce", "key-copies"]
