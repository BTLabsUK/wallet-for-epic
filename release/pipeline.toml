# The release pipeline: every step a release runs, in the order the graph gives (needs).
# Read by tools/rel (docs/RELEASING.md). No hosts or addresses here: steps name a host ROLE
# (build, signer, windows, apple, web), and ~/.config/btlabs/release-hosts.toml says what each
# role is on this machine (release/hosts.example.toml). The scripts named in `run` do the work;
# tools/rel decides order, host, gates, logs and state.
#
# Step fields:
#   title      what the live message and the report call it ({variant} is filled in)
#   kind       command (default) | builtin | gate | handoff | publish
#   platform   android | linux | windows | macos | ios, or a list: the step is in the graph only
#              when one of them is in the release's scope (release.toml [platforms])
#   when       scope switches that must all be on, e.g. ["stores.play"] or ["publish.manifests"]
#   unless     scope switches that must all be off, e.g. ["apple.signed"]
#   for_each   "variant" (one step per variant in scope: -tor, -notor) or "proof_variant"
#              (the variants [proof] update-tests)
#   needs      step names; a name with for_each means all its instances, name@variant the
#              instance of the same variant. Steps the scope leaves out are dropped from needs.
#   host       the role that runs it (default build); the signer role holds the keys
#   lane       steps in one lane run one at a time, lanes side by side ({variant} is filled in).
#              Default: every heavy step one lane, every remote host its own, the rest "local"
#   run        a bash command (set -euo pipefail), from {src} unless cwd says otherwise
#   env        extra environment; {placeholders} below
#   heavy      true: wrapped in build-slot when it exists, one heavy step at a time
#   outputs    files the step leaves in {stage} that are published: copied into {files}
#   extras     files the step leaves in {stage} that are kept but never published ({extra})
#   variants   with for_each: only these variants, e.g. ["tor"] (Play takes one bundle per version code)
#   proof      true: the step must write {stage}/proof.json with every [proof] check true
#   skippable  true: release.toml [skip] may skip it with a reason (builds and gates never)
#   publish    true: a command step of the publish phase (after the gate); kind publish implies it
#   warn_only  true: a failure is shown as a warning (relmsg: failed, no alert; report: warned) and
#              holds nothing; the run still ends ok. For after-publish steps, and for the pre-gate
#              screens render, whose result screens-check judges (never a gate, proof or build)
#   timeout    e.g. "90m", a hard limit (then killed; never retried by itself); a build-phase command
#              without one gets [defaults] timeout. retries: re-runs on any failure before it
#              counts as failed (infrastructure failures retry by themselves: [concurrency])
#   capped     true: counts toward [concurrency] max_heavy although it is not heavy itself
#   scratch    publish steps: what runs instead when the target is scratch (a builtin name)
#   A step may leave links.json ([{label, url}]) and notice.json ({title, detail, expects}) in
#              {stage}: tools/rel adds the links to the live message and sends the notice once.
#   reuse      repo paths the step's result depends on ("!path" leaves part of a folder out): an
#              earlier run's passing result with the same content (and env, outputs, version) is
#              reused instead of running the step (tools/rellib/reuse.py); reuse_nightly = true
#              also takes a green nightly full check of such a commit, reuse_green = true any
#              green `tools/check.sh --full` on a clean tree of one (/tmp/epic-build/green/<sha>.json)
#
# Placeholders: {version} {commit} {short} {run_id} {run} {files} {extra} {stage} {src}
# {variant} {notor} ("" or "-notor") {tor} ("1" or "0") {github} ("1" when publish.github is on, else "0")
# {play_promote} (release.toml stores.play_promote, e.g. "beta", or "")
# {previous_dir} {previous_version}
# {previous_ref} {node} {epicbox} {target} {scratch} {notes_file} {manifests}
# {rel} (the checkout tools/rel runs from: its step scripts and drivers)
# {host.<role>.<key>} {path.<key>} (both from release-hosts.toml).

[defaults]
state_root = "/tmp/epic-build/rel"
heavy_wrap = ["build-slot"]
min_free_gb = 30
# The hard limit of a build-phase command step that sets no `timeout` of its own.
timeout = "180m"
# Pre-flight health pick for test drivers: the first healthy one, BT Labs first.
nodes = ["https://node.btlabs.uk", "https://node.epicnet.us:3413", "https://node.epiccash.com"]
epicboxes = ["epicbox.stackwallet.com", "epicbox.epicnet.us", "epicbox.epiccash.com"]

# The signed update manifests (update.json, update-v2.json; WAL-01). validity_days is how long a
# signed manifest is valid (expires_at - issued_at), for a release, a rollback and
# `tools/rel resign`; clients accept at most 400 (btlabs-public FORMAT.md section 5). 45 days
# with a `tools/rel resign` once a month (the owner, 2026-10-31): a frozen or stalled feed goes stale
# within weeks (docs/RELEASING.md, "Re-signing the live manifests"). warn_days: G1 and
# `tools/rel doctor` warn when the live manifest expires sooner than that.
[manifest]
validity_days = 45
warn_days = 14

[relmsg]
bin = "relmsg"
title = "Epic Wallet"

# How a run shares this machine (tools/rellib/window.py; docs/RELEASING.md, "Sharing the
# machine"). 26.10.25 run-8 lost every Android and Windows trust lane ("no proof.json (driver
# exit -15)" at about 1,190 s) with 7-9 steps side by side at load 36 and 17-22 GB in use.
# max_heavy: heavy steps at once (heavy, proof or capped); `tools/rel start|resume|sign
# --max-heavy N` changes it for a run. apart: pairs that never run together. apart_shared: pairs
# kept apart only while agents share the machine (shared; --exclusive-machine turns it off for a
# run). A step kept apart from source-check also waits up to external_wait while a build-slot
# slot runs one of external_suites. infra_retries: automatic retries of a failure caused by the
# machine (a signal, no proof.json, an ssh drop, no build slot); product failures never retry.
# window_marker: the release window file build-slot reads (default
# $XDG_RUNTIME_DIR/wfe-release-window, i.e. /run/user/<uid>/wfe-release-window).
[concurrency]
max_heavy = 2
shared = true
apart = [["source-check", "trust-android"], ["source-check", "trust-windows"]]
apart_shared = [["trust-android", "trust-windows"]]
external_suites = ["check.sh --full", "flutter-test-all", "source-check.sh"]
external_wait = "60m"
infra_retries = 1

# When sign-android asks for the owner's code. The signer binds the code to the exact bytes, so it
# can only be asked once every build is in. "on-demand": the step then waits (exit 10) while the
# other lanes go on, the owner gets one message, and `tools/rel sign` asks when he is ready (two runs
# lost 1,804 s each to a code that did not come in the 35 min a request waits). "inline": ask at
# once and wait for it (`tools/rel start --sign-inline` does that for one run).
[sign]
when = "on-demand"

# G4: what "proven" means for a platform. DEFAULT PENDING the owner'S CALL: the previous release
# with a funded wallet, history, custom nodes and relays and changed settings updates the way
# users update to the candidate and keeps all of it; then one send and one receive on BT Labs
# infrastructure. A platform in scope that is not proven stops the release unless release.toml
# waives it ([proof] waive), and the publish gate then shows it as not proven.
[proof]
status = "default pending the owner's call"
checks = ["wallet_opens", "balance_kept", "history_kept", "custom_nodes_kept", "custom_relays_kept", "settings_kept",
          "store_encrypted", "app_files_kept", "lan_nodes_kept", "contact_note_kept"]
funds_checks = ["send_ok", "receive_ok"]
# A new app beside the previous one (app id changed, authorised: the owner 2026-11-02 for 26.10.25):
# the wallet is restored from its phrase, so the checks on carried data do not apply. Only for
# these (previous, candidate) package pairs, and only when the driver's proof says "beside".
beside_pairs = [["uk.btlabs.epiccash.mobile", "uk.btlabs.btwallet"]]
beside_not_applicable = ["history_kept", "custom_nodes_kept", "custom_relays_kept", "settings_kept",
                         "store_encrypted", "app_files_kept", "lan_nodes_kept", "contact_note_kept"]
funds_variant = "tor"
variants = ["tor", "notor"]

[proof.drivers]
android = "{rel}/tools/rellib/drivers/trust-android.sh"
linux = "{rel}/tools/rellib/drivers/trust-linux.sh"
windows = "{rel}/tools/rellib/drivers/trust-windows.sh"
# macos, ios: no driver yet; those platforms are not proven until one exists.

# ---- G0, G1, source -------------------------------------------------------------------------

[step.scope]
title = "G0 scope"
kind = "builtin"
host = "local"

[step.preflight]
title = "G1 preflight"
kind = "builtin"
host = "local"
needs = ["scope"]

[step.source]
title = "Source checkout"
kind = "builtin"
host = "build"
needs = ["preflight"]

[step.source-check]
title = "G2 source gate (tools/check.sh)"
host = "build"
needs = ["source"]
run = "{rel}/tools/rellib/steps/source-check.sh {stage}"
heavy = true
timeout = "120m"
# Reused (not run) when an earlier run or the nightly passed it on the same content of these:
# the app, the bot, the pins and tools/check.sh with what it runs (tools/rellib/reuse.py), the
# release tools' own tests and what they test included (not release/release.toml: the scope,
# edited for every release, would never let G2 be reused).
reuse = ["app", "bot", "scripts/linux/flutter.version", "tools/check.sh", "tools/env.sh", "tools/version.sh",
         "tools/lepic.sh", "tools/lepic.rev", "tools/lepic-flutter.rev", "tools/check-install-contract.sh",
         "tools/install_contract.py", "tools/install-contract.json", "docs/install-contract.md",
         "tools/check-no-hosts.sh", "tools/no_hosts.py", "tools/no-hosts.allow",
         "tools/rel", "tools/rellib", "release/pipeline.toml", "release/failures.toml", "release/hosts.example.toml",
         "tools/nightly", "tools/sbom.py", "tools/test_sbom.py",
         "tools/t", "tools/tlib", "tools/flutter_test_order.py", "tools/test_flutter_test_order.py", "tools/publish-github.sh",
         "tools/publish", "tools/screens-feedback", "tools/gitlab-release.py", "tools/signer"]
reuse_nightly = true
# Any green `tools/check.sh --full` on a clean tree with this content (the nightly's, a person's on
# the candidate): tools/rel start refuses a candidate without one unless --run-source-check.
reuse_green = true

# ---- builds ----------------------------------------------------------------------------------

[step.build-android]
title = "Android APK ({variant})"
platform = "android"
for_each = "variant"
# Without a signer Android is signed inside the Gradle build, so it runs where the release key
# is; with one it builds unsigned (tool/build_android_release.sh) and sign-android signs it.
host = "signer"
needs = ["source-check"]
run = "app/tool/build_android_release.sh {stage}"
env = { WFE_TOR = "{tor}", WFE_EMULATOR_X86_64 = "1" }
heavy = true
outputs = ["bt-wallet-{version}{notor}-android-arm64-v8a.apk"]
extras = ["emulator/bt-wallet-{version}{notor}-android-x86_64.apk"]
timeout = "120m"
# The app without its tests and side tools, the build script and the tools it calls, the pins.
reuse = ["app", "!app/test", "!app/integration_test", "!app/tool", "app/tool/build_android_release.sh",
         "scripts/linux/flutter.version", "tools/env.sh", "tools/version.sh", "tools/lepic.sh", "tools/lepic.rev",
         "tools/lepic-flutter.rev", "tools/build-tor-android.sh", "tools/tor-src.json", "tools/fetch-tor.sh",
         "tools/tor-bundle.json", "tools/dist-check.sh"]

# Play takes one bundle per version code: the build with Tor, as every Play upload since 26.10.20.
# (Two variants with the same version code would make the second upload fail.)
[step.build-play]
title = "Google Play bundle ({variant})"
platform = "android"
when = ["stores.play"]
for_each = "variant"
variants = ["tor"]
host = "signer"
needs = ["build-android"]
run = "app/tool/build_android_release.sh {stage}"
env = { WFE_TOR = "{tor}", WFE_DIST = "play" }
heavy = true
extras = ["bt-wallet-{version}{notor}-play-android.aab"]
timeout = "120m"

# With a signer ([host.signer] endpoint, docs/RELEASING.md "Signer") the builds are unsigned and
# this signs every Android file of the run (APKs, emulator APKs, the Play bundle) in one request
# The owner approves with one code; G3 then takes the signed bytes (signed.json). With manifests in
# the run that request also declares them, and the manifests step signs them on the same code
# (one code per release, the owner 2026-10-31): so it waits for every build the manifests and G3
# name, and the follow-up comes within minutes. Without a signer the builds signed themselves
# and this only checks the certificate. Its own lane: it may wait 30 min.
[step.sign-android]
title = "Android signing"
kind = "builtin"
host = "local"
platform = "android"
lane = "sign"
needs = ["build-android", "build-play", "build-linux", "build-windows", "apple-mac-check", "ios-testflight",
         "apple-adhoc-mac", "apple-adhoc-ios"]

[step.build-linux]
title = "Linux AppImage ({variant})"
platform = "linux"
for_each = "variant"
host = "build"
# Its own lane, beside the Android builds (the owner 2026-10-30): it builds in its own container from
# its own copy of the code. Each build still takes a build-slot slot (heavy = true); the two
# Linux variants one after the other. metrics.jsonl has the pair's peak memory ("overlap" lines).
lane = "build-linux"
needs = ["source-check"]
run = "scripts/build-linux.sh && mv -f build-linux/bt-wallet-{version}{notor}-linux-x86_64.AppImage {stage}/"
env = { WFE_TOR = "{tor}", WFE_NODE_BIN = "{path.node_bin_linux}" }
heavy = true
outputs = ["bt-wallet-{version}{notor}-linux-x86_64.AppImage"]
timeout = "120m"
# The app without its tests and side tools, the container build (scripts/), the tools it calls.
reuse = ["app", "!app/test", "!app/integration_test", "!app/tool", "scripts", "tools/env.sh", "tools/version.sh",
         "tools/lepic.rev", "tools/lepic-flutter.rev", "tools/fetch-tor.sh", "tools/tor-bundle.json"]

[step.build-windows]
title = "Windows installer ({variant})"
platform = "windows"
for_each = "variant"
host = "windows"
# The variants build side by side, each in its own work dir (the owner 2026-10-31: the Windows
# machine takes 4-6 jobs).
lane = "build-windows-{variant}"
needs = ["source-check"]
# A fresh work dir per run and variant on the Windows machine (never a stale LEPIC blob from an
# older run); only this run's installer is taken back.
run = "app/tool/build_windows_release_remote.sh {host.windows.ssh} {host.windows.workdir}/{run_id}-{variant} && mv -f build-windows/bt-wallet-{version}{notor}-windows-x64-setup.exe {stage}/"
env = { WFE_TOR = "{tor}", WFE_NODE_BIN_WIN = "{path.node_bin_windows}" }
outputs = ["bt-wallet-{version}{notor}-windows-x64-setup.exe"]
timeout = "150m"
# The app without its tests and side tools, the two build scripts, the tools and pins they read
# (the Windows toolchain lives on that machine), as for the other builds.
reuse = ["app", "!app/test", "!app/integration_test", "!app/tool", "app/tool/build_windows_release.ps1",
         "app/tool/build_windows_release_remote.sh", "tools/lepic.rev", "tools/lepic-flutter.rev",
         "tools/fetch-tor.sh", "tools/tor-bundle.json"]

# Apple (tools/apple-release.md): the Mac builds, signs with Developer ID, notarises and staples
# (Xcode's automatic signing). Hand-off steps write a job for the Mac and wait for its results;
# Linux then checks the Mac's report before anything can ship. tools/apple-sign.sh (signing on
# Linux) is the backup route only, not in this graph.
[step.apple-mac]
title = "macOS signed + notarised dmg ({variant})"
kind = "handoff"
platform = "macos"
when = ["apple.signed"]
for_each = "variant"
host = "apple"
needs = ["source-check"]
run = "git fetch job/wfe.bundle HEAD && git checkout --detach FETCH_HEAD && test \"$(git rev-parse HEAD)\" = {commit} && RELEASE_COMMIT={commit} WFE_TOR={tor} tools/build-apple.sh mac-release  # then build-apple/mac-release/bt-wallet-{version}{notor}-macos.{dmg,dmg.sha256,REPORT.txt} into results/"
results = ["bt-wallet-{version}{notor}-macos.dmg", "bt-wallet-{version}{notor}-macos.dmg.sha256", "bt-wallet-{version}{notor}-macos.REPORT.txt"]
timeout = "48h"

[step.apple-mac-check]
title = "macOS dmg check: sha256, commit, Team ID, Gatekeeper ({variant})"
platform = "macos"
when = ["apple.signed"]
for_each = "variant"
host = "local"
needs = ["apple-mac@variant"]
run = "{rel}/tools/rellib/steps/apple-mac-check.sh {run}/handoff/apple-mac-{variant}/results bt-wallet-{version}{notor}-macos.dmg {commit} \"{host.apple.team_id}\" {stage}"
outputs = ["bt-wallet-{version}{notor}-macos.dmg"]

# iOS goes to TestFlight from Xcode (Archive → Distribute → App Store Connect): nothing is
# published from here. Only the build without Tor. The builder writes REPORT.txt by hand (the
# build number and "uploaded").
[step.ios-testflight]
title = "iOS to TestFlight"
kind = "handoff"
platform = "ios"
when = ["apple.signed"]
host = "apple"
needs = ["source-check"]
run = "git fetch job/wfe.bundle HEAD && git checkout --detach FETCH_HEAD && test \"$(git rev-parse HEAD)\" = {commit} && RELEASE_COMMIT={commit} WFE_TOR=0 tools/build-apple.sh ios-prepare  # then Xcode Archive → Distribute → App Store Connect; results/REPORT.txt: build number + uploaded"
results = ["REPORT.txt"]
timeout = "48h"

# Apple ad hoc (release.toml [apple] signed = false, --set apple.signed=false): what 26.10.24
# shipped, for test releases without the team's signing set-up. One Mac build per variant gives
# the ad-hoc-signed .dmg (not notarised: Gatekeeper asks the user to open it by hand) and the
# unsigned .ipa (a device install needs it signed first). Linux checks the Mac's results.txt
# (release-check at the commit, every step PASS) and the SHA256SUMS before either file can ship.
[step.apple-adhoc]
title = "Apple ad-hoc dmg + unsigned ipa ({variant})"
kind = "handoff"
platform = ["macos", "ios"]
unless = ["apple.signed"]
for_each = "variant"
host = "apple"
needs = ["source-check"]
run = "git fetch job/wfe.bundle HEAD && git checkout --detach FETCH_HEAD && test \"$(git rev-parse HEAD)\" = {commit} && RELEASE_COMMIT={commit} WFE_TOR={tor} WFE_NODE_FETCH=1 APPLE_OUT=build-apple/{variant} tools/build-apple.sh release-check doctor sources lepic macos dmg ipa  # then build-apple/{variant}/{bt-wallet-{version}{notor}-macos.dmg,bt-wallet-{version}{notor}-ios-unsigned.ipa,results.txt} into results/ with their SHA256SUMS"
results = ["bt-wallet-{version}{notor}-macos.dmg", "bt-wallet-{version}{notor}-ios-unsigned.ipa", "results.txt", "SHA256SUMS"]
timeout = "48h"

[step.apple-adhoc-mac]
title = "macOS ad-hoc dmg check: sums, commit, steps ({variant})"
platform = "macos"
unless = ["apple.signed"]
for_each = "variant"
host = "local"
needs = ["apple-adhoc@variant"]
run = "{rel}/tools/rellib/steps/apple-adhoc-check.sh {run}/handoff/apple-adhoc-{variant}/results bt-wallet-{version}{notor}-macos.dmg {commit} {version} {stage}"
outputs = ["bt-wallet-{version}{notor}-macos.dmg"]

[step.apple-adhoc-ios]
title = "iOS unsigned ipa check: sums, commit, steps ({variant})"
platform = "ios"
unless = ["apple.signed"]
for_each = "variant"
host = "local"
needs = ["apple-adhoc@variant"]
run = "{rel}/tools/rellib/steps/apple-adhoc-check.sh {run}/handoff/apple-adhoc-{variant}/results bt-wallet-{version}{notor}-ios-unsigned.ipa {commit} {version} {stage}"
outputs = ["bt-wallet-{version}{notor}-ios-unsigned.ipa"]

# ---- screens, beside the builds (docs/RELEASING.md, "Screens") --------------------------------

# The screen catalogue (tools/screens.sh --candidate) of this release's own source, from when G2
# passed, in its own lane beside the builds and G4: each tour's flutter test takes a build-slot
# slot like a build (the step itself is not heavy, or it would hold a slot while it waits for
# them). `latest` stays on the published release until screens-publish. Reuses the catalogue when
# its content key is unchanged. warn_only: a failed render never stops a build or a trust run
# mid-way; screens-check turns it into a FAIL before the gate. Defined after the builds, so when G2
# passes the builds ask for their slots first.
[step.screens]
title = "Screen catalogue (render)"
host = "build"
lane = "screens"
warn_only = true
skippable = true
capped = true
needs = ["source-check"]
run = "{rel}/tools/rellib/steps/screens.sh {version} {stage}"
timeout = "120m"

# ---- G3, manifests, G4, G5 -------------------------------------------------------------------

[step.artefacts]
title = "G3 artefacts"
kind = "builtin"
host = "local"
needs = ["build-android", "sign-android", "build-linux", "build-windows", "apple-mac-check", "ios-testflight",
         "apple-adhoc-mac", "apple-adhoc-ios"]

[step.manifests]
title = "Update manifests (signed)"
host = "signer"
when = ["publish.manifests"]
needs = ["artefacts"]
run = "{rel}/tools/rellib/steps/manifests.sh"
outputs = []

[step.trust-manifest]
title = "G4 manifest checks"
kind = "builtin"
host = "local"
when = ["publish.manifests"]
needs = ["manifests"]

# Update trust runs per platform from when this machine's builds are done (no driver competes
# with a build for the CPU), Windows and macOS also after their own build, Android and Linux
# without waiting for them; at most [concurrency] max_heavy at once, Android and Windows never
# beside each other while the machine is shared nor beside a full suite. Each lane has a hard
# limit (Android and Windows 50 min, about 2.5x their slowest pass so far, 1,198 s and 1,280 s;
# Linux 60 min, its slowest was 2,447 s under load); a lane killed by the machine (a signal, no
# proof.json, an ssh drop) runs once more by itself, a product failure or a timeout never. The drivers wait on the chain and on P, not on the CPU, and P's legs
# queue on P's own lock. Each Android variant has its own test wallet and emulator (tor: the app
# wallet in rel-trust-android; notor: wallet Q, see trust-android.sh), so the two run at once; each
# Linux variant makes its own wallet in its own sandbox, so they run at once too. G3 and every
# platform's trust still come before the publish gate (update-trust). Whether trust may start
# right after its own build is decided later from metrics.jsonl (per-step load, overlaps,
# emulator health; docs/RELEASING.md).
[step.trust-android]
title = "G4 update trust Android ({variant})"
platform = "android"
for_each = "proof_variant"
host = "build"
lane = "trust-android-{variant}"
needs = ["build-android", "build-play", "sign-android", "build-linux"]
proof = true
timeout = "50m"

[step.trust-linux]
title = "G4 update trust Linux ({variant})"
platform = "linux"
for_each = "proof_variant"
host = "build"
lane = "trust-linux-{variant}"
# No sign-android: the AppImage is not signed one by one (SHA256SUMS.sig covers it), so the
# desktop trust runs need no signature and do not wait for the release's code.
needs = ["build-android", "build-play", "build-linux"]
proof = true
timeout = "60m"

[step.trust-windows]
title = "G4 update trust Windows ({variant})"
platform = "windows"
for_each = "proof_variant"
host = "build"
# A lane per variant, each on its own rig session ([host.windows] rigs in release-hosts.toml,
# e.g. tor = 1, notor = 5; both 1 when unset). Every rig job runs in Windows session 0, so jobs of
# one Windows user share the app's single-instance mutex (Local\uk.btlabs.epiccash.desktop.single)
# and Setup's HKCU uninstall entry: the driver holds a lock per rig user, and two variants whose
# rigs have the same user still run one after the other. Only rigs with different users overlap.
lane = "trust-windows-{variant}"
needs = ["build-android", "build-play", "build-linux", "build-windows@variant"]  # no signature, as Linux
proof = true
timeout = "50m"

[step.trust-macos]
title = "G4 update trust macOS ({variant})"
platform = "macos"
for_each = "proof_variant"
host = "build"
lane = "trust-macos"
needs = ["build-android", "build-play", "sign-android", "build-linux", "apple-mac-check@variant", "apple-adhoc-mac@variant"]
proof = true

[step.trust-ios]
title = "G4 update trust iOS ({variant})"
platform = "ios"
for_each = "proof_variant"
host = "build"
lane = "trust-ios"
needs = ["build-android", "build-play", "sign-android", "build-linux", "ios-testflight", "apple-adhoc-ios@variant"]
proof = true

[step.update-trust]
title = "G4 update trust"
kind = "builtin"
host = "local"
needs = ["artefacts", "trust-manifest", "trust-android", "trust-linux", "trust-windows", "trust-macos", "trust-ios"]

# ---- screen check, before the gate (docs/RELEASING.md, "Screens") ---------------------------

# The pre-gate screen check (tools/rellib/steps/screens_check.py): tour failures, screens gone vs
# the published release, raw l10n keys, unfilled placeholders, debug text, new hosts / network
# words / error texts on screens, translations the screens need, the visual diff, and the real
# installed-build screens the G4 drivers took (copied into the catalogue's real/). Its summary is
# in the publish-gate message. FAIL findings fail it (fix, or `tools/rel skip screens-check
# --reason ...`); warnings never hold anything. After G4, so a FAIL stops nothing but the gate.
[step.screens-check]
title = "Screen check (before the gate)"
host = "local"
lane = "screens"
skippable = true
needs = ["screens", "update-trust"]
run = "{rel}/tools/rellib/steps/screens_check.py {version} {stage}"
timeout = "30m"

[step.publish-gate]
title = "G5 publish gate"
kind = "gate"
host = "local"
needs = ["update-trust", "screens-check"]

# ---- publish, in fixed order: tag -> downloads -> page -> source -> manifests last -----------

# The release tag v<version> (v<version>-rN for a rebuild) on the release commit, which must be on
# main; local only, pushed by publish-source. TEST runs and the scratch target make none.
[step.tag]
title = "Release tag"
host = "build"
publish = true
needs = ["publish-gate"]
run = "{rel}/tools/rellib/steps/tag.sh {version} {commit} {path.main_checkout} {stage}"

[step.publish-downloads]
title = "Publish downloads"
kind = "publish"
host = "web"
needs = ["tag"]
run = "{rel}/tools/rellib/steps/publish-downloads.sh {files} {host.web.ssh} {host.web.downloads_dir}"
scratch = "scratch_downloads"

[step.publish-page]
title = "Publish release page"
kind = "publish"
host = "web"
needs = ["publish-downloads"]
skippable = true
run = "{rel}/tools/rellib/steps/publish-page.sh {version} {files} {path.page_repo} {path.main_checkout}"
# publish.github on: the page links the GitHub Release (build.py add --github).
env = { REL_GITHUB = "{github}" }
scratch = "scratch_page"

[step.publish-source]
title = "Publish source (GitLab)"
kind = "publish"
host = "build"
needs = ["publish-page"]
skippable = true
run = "cd {path.main_checkout} && tools/publish-github.sh --push"
# publish.github on: then mirrored to GitHub (tools/mirror-github.sh), so the tag is there.
env = { GITHUB_MIRROR = "{github}" }
scratch = "scratch_source"

# The GitHub Release of tag v{version}: every published file as an asset, marked latest, so
# github.com/BTLabsUK/wallet-for-epic/releases/latest/download/<name> serves the newest. A mirror:
# BT Labs' server stays the primary source. On a failure `tools/rel skip publish-github-release
# --reason ...` lets the manifests go out without it.
[step.publish-github-release]
title = "Publish GitHub release (mirror)"
kind = "publish"
host = "signer"
when = ["publish.github"]
needs = ["publish-source"]
skippable = true
retries = 1
run = "{rel}/tools/rellib/steps/publish-github-release.sh {version} {files} {stage}"
scratch = "scratch_noop"

[step.publish-manifests]
title = "Publish update manifests (the switch)"
kind = "publish"
host = "signer"
when = ["publish.manifests"]
needs = ["publish-downloads", "publish-page", "publish-source", "publish-github-release"]
run = "tools/publish-update-json.sh {manifests}/update.json {manifests}/update-v2.json"
# publish.github on: update-v2.json also onto the latest GitHub Release (never a gate).
env = { GITHUB_UPDATE_JSON = "{github}" }
scratch = "scratch_manifests"

[step.verify-live]
title = "G6 read back"
kind = "builtin"
host = "local"
publish = true
needs = ["publish-manifests", "publish-downloads", "publish-page"]

[step.prune-downloads]
title = "Prune older downloads"
kind = "publish"
host = "web"
skippable = true
needs = ["verify-live"]
run = "{rel}/tools/rellib/steps/prune-downloads.sh {version} {host.web.ssh} {host.web.downloads_dir} {previous_dir} {manifests}"
scratch = "scratch_prune"

[step.store-play]
title = "Google Play upload (internal)"
kind = "publish"
platform = "android"
when = ["stores.play"]
for_each = "variant"
variants = ["tor"]
host = "signer"
skippable = true
needs = ["verify-live", "build-play@variant"]
run = "tools/play-upload.sh {run}/extra/bt-wallet-{version}{notor}-play-android.aab --track internal --notes-file {notes_file}"
scratch = "scratch_noop"

# Then the same bundle onto a testing track after internal (stores.play_promote, e.g. "beta"), as
# 26.10.24 went to the open beta; production stays a click in Play Console.
[step.store-play-promote]
title = "Google Play: internal to the next testing track"
kind = "publish"
platform = "android"
when = ["stores.play", "stores.play_promote"]
host = "signer"
skippable = true
needs = ["store-play"]
run = "tools/play-upload.sh --promote {play_promote} --notes-file {notes_file}"
scratch = "scratch_noop"

# The release is live: its catalogue (step screens, before the gate) becomes `latest` and the
# public gallery https://epiccash.btlabs.uk/screens/ (tools/screens-publish.sh), as every release
# did by hand up to 26.10.23. A TEST run builds the public copy only. Never holds the release.
[step.screens-publish]
title = "Screen gallery (publish)"
host = "build"
lane = "screens"
publish = true
warn_only = true
skippable = true
needs = ["verify-live"]
run = "{rel}/tools/rellib/steps/screens-publish.sh {version} {stage}"
timeout = "60m"

# The draft Telegram post, from the version's changelog entry, sent to the owner to edit and post (the
# lead's telegram-<version>.txt up to 26.10.23). Posts nothing. A failure is a warning.
[step.announce]
title = "Telegram post (draft for the owner)"
host = "local"
publish = true
warn_only = true
skippable = true
needs = ["verify-live"]
run = "{rel}/tools/rellib/steps/announce.py {version} {path.page_repo} {stage}"

# Q-DEL (the owner's yes, 2026-10-31): once a release signed through the signer is live, ask him
# to delete the key copies on the build machine (docs/RELEASING.md, Signer). Deletes nothing itself; asks
# nothing in a run without the signer or once the files are gone. A failure is a warning.
[step.key-copies]
title = "Key copies on the build machine (ask the owner)"
host = "local"
publish = true
warn_only = true
skippable = true
needs = ["verify-live"]
run = "{rel}/tools/rellib/steps/key-copies.sh {stage}"

[step.cleanup]
title = "Cleanup (keep the previous release only)"
kind = "builtin"
host = "local"
publish = true
skippable = true
# After every step that still reads the release worktree (screens-publish runs its tools).
needs = ["verify-live", "prune-downloads", "store-play", "store-play-promote", "screens-publish", "announce", "key-copies"]
