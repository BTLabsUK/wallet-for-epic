# Known failures: a log pattern (Python regex, searched in the last 200 KB of a failed step's
# log) and the fix that worked. tools/rel prints the hint with the failure, puts it in --json
# output and in the Telegram alert. Add one whenever a release teaches something new.
#
# [[failure]]
# id      short name
# steps   optional: step names (base names, e.g. build-linux) it applies to; all when absent
# pattern regex
# hint    what to do

[[failure]]
id = "disk-guard"
pattern = "(No space left on device|disk guard|free space below)"
hint = "Disk is full or under the 30 GB rule. Free regenerable build output (old worktrees' app/build, LEPIC target dirs, `docker builder prune`), then `tools/rel retry <step>`."

[[failure]]
id = "container-clang"
steps = ["build-linux"]
pattern = "(zxing|ZXing).*(requires|need).*(C\\+\\+20|clang)|clang\\+\\+.*version 14"
hint = "The Ubuntu 22.04 container's clang is too old for zxing-cpp: the image must have clang 18 from apt.llvm.org (scripts/linux/Dockerfile). Rebuild the image (docker build in scripts/linux) and retry."

[[failure]]
id = "node-bin-missing"
steps = ["build-linux", "build-windows"]
pattern = "(WFE_NODE_BIN|node binary).*(missing|not found|No such file)"
hint = "The built-in node's binary is missing: set paths.node_bin_linux / node_bin_windows in ~/.config/btlabs/release-hosts.toml (epic 4.1.1 from /tmp/epic-build/node-bin)."

[[failure]]
id = "stale-xtask"
pattern = "(SOURCE.*(differs|mismatch)|lepic\\.rev.*(differs|mismatch)|built from .*worktree)"
hint = "LEPIC's xtask was built for another tree (app/third_party moved): `cargo clean -p xtask` in app/third_party/lepic, then retry. Never symlink third_party from another worktree."

[[failure]]
id = "lepic-pin"
pattern = "differs from the LEPIC pin of lepic-flutter"
hint = "tools/lepic.rev must equal lepic-flutter's own lepic.rev: fix the pin on main, not in the release."

[[failure]]
id = "pub-registrant"
steps = ["build-android", "build-play"]
pattern = "integration_test.*(not found|Error)"
hint = "Stale plugin registrant after `flutter test`: run `flutter pub get` in app/ and retry."

[[failure]]
id = "android-key"
steps = ["build-android", "build-play"]
pattern = "(key\\.properties|keystore).*(not found|missing|No such file)"
hint = "The Android release key is not on this machine: host.signer.android_key_properties in release-hosts.toml (default ~/.config/btlabs/android/key.properties). Android builds run on the signer."

[[failure]]
id = "update-url-exec"
steps = ["manifests"]
pattern = "check_update_urls\\.sh: Permission denied"
hint = "app/tool/check_update_urls.sh lost its exec bit: `git update-index --chmod=+x` on main."

[[failure]]
id = "manifest-v2-config"
steps = ["manifests", "trust-manifest", "publish-manifests"]
pattern = "(malformed|does not verify).*update-v2"
hint = "update-v2.json must be verified with --app-config app/assets/config/app-config.toml (its URLs are checked against [updates])."

[[failure]]
id = "manifest-size"
steps = ["manifests", "trust-manifest"]
pattern = "(damaged|size mismatch)"
hint = "A size taken through a symlink: sizes must come from `stat -L`; the files in the run folder must be real files."

[[failure]]
id = "serial-not-above"
steps = ["manifests", "publish-manifests"]
pattern = "serial.*(not above|must be greater|<=)"
hint = "The new serial is not above the live manifest's (clock or another publish): re-run `tools/rel retry manifests` to sign with a fresh serial."

[[failure]]
id = "windows-stale-workdir"
steps = ["build-windows"]
pattern = "(kernel_blob|LepicCache|stale)"
hint = "A stale Windows work dir: each run uses {workdir}/{run_id}; delete that folder on the Windows machine and retry. Never use -LepicCache for a release."

[[failure]]
id = "ssh-unreachable"
pattern = "(ssh: connect to host|Connection timed out|Could not resolve hostname|Permission denied \\(publickey)"
hint = "The remote host is not reachable over ssh: check it is on (tailnet), then `tools/rel retry <step>`."

[[failure]]
id = "scanner-hit"
steps = ["publish-source"]
pattern = "(scan|check).*(FAIL|private detail|agent path)"
hint = "The publish scanner found a private detail: add the rule in tools/publish/ (or fix the file on main), then `tools/rel retry publish-source --again`."

[[failure]]
id = "github-login"
steps = ["publish-source", "publish-github-release", "publish-manifests"]
pattern = "(Permission denied \\(publickey\\)|gh is not logged in|gh is logged in as|401 Unauthorized|Bad credentials)"
hint = "GitHub refused BT Labs' login: git needs the SSH key for git@github.com (~/.ssh/config), gh needs GH_CONFIG_DIR=~/.config/gh-btlabs logged in as btlabs-uk (owner renews it), then retry."

[[failure]]
id = "play-notes"
steps = ["store-play"]
pattern = "(500 characters|releaseNotes.*too long)"
hint = "Play release notes must be at most 500 characters per language."

[[failure]]
id = "play-code-used"
steps = ["store-play"]
pattern = "Version code .* already (been )?used"
hint = "That version code is already on Play: promote the existing bundle (tracks.update with versionCodes) instead of uploading."

[[failure]]
id = "fdroid-disk"
pattern = "fdroid.*(disk|space)"
hint = "F-Droid's build server stops under the disk guard: free space first."

[[failure]]
id = "check-red"
steps = ["source-check"]
pattern = "(Some tests failed|\\d+ tests? failed|check failed)"
hint = "tools/check.sh is red on this commit. Fix on main (not in the release), merge, and start a new run from the new commit."

[[failure]]
id = "tag-not-on-main"
steps = ["tag"]
pattern = "is not on main in"
hint = "The release commit is not on main. Merge it into main (fast-forward), then `tools/rel retry tag`; nothing has left the machine yet."

[[failure]]
id = "screens-lock"
steps = ["screens"]
pattern = "screens: another run holds"
hint = "Another tools/screens.sh holds /tmp/epic-build/screens/.lock. Wait for it, then `tools/rel run screens --again` (the release is not held)."

[[failure]]
id = "screens-tours"
steps = ["screens"]
pattern = "screens: no catalog made for"
hint = "A screenshot tour failed; its logs are in /tmp/epic-build/screens/failed-<version>.logs. Fix the tour on main and run the catalogue by hand later (tools/screens.sh <version> && tools/screens-publish.sh <version>)."

[[failure]]
id = "screens-publish-host"
steps = ["screens"]
pattern = "screens-publish: (no ssh host|WARNING .* does not serve)"
hint = "The gallery deploy: set SCREENS_SSH_HOST in ~/.config/btlabs/screens-publish.env, or check the landing page's nginx site (epiccash-landing deploy/install.sh); then `tools/rel run screens --again`."

[[failure]]
id = "linux-sandbox-display"
steps = ["trust-linux"]
pattern = "refusing: DISPLAY \\S+ is not this sandbox's Xvfb"
hint = "Two Linux trust sandboxes took one X display (fixed in sandbox.py 100ea4b49: a display counts only when its lock names our Xvfb). On an older checkout: `tools/rel retry trust-linux-<variant>` once the other run is up."

[[failure]]
id = "windows-copy-address"
steps = ["trust-windows"]
pattern = "no Epicbox address could be read after the update"
hint = "Usually the Windows click map, not the app: check wfe.log in the step's out/ for 'wallet opened' and 'epicbox subscribed' after the candidate's start, then render Receive at 800x700 (DESK_SHOTS_SIZE=800x700 flutter test tool/desktop_tour_test.dart --plain-name 17-receive) and compare the copy button with COPY_ADDRESS in drivers/windows/trust.py. No 'wallet opened' = the app: stop and report."

[[failure]]
id = "linux-atspi-socket-long"
steps = ["trust-linux"]
pattern = "never showed 're:\\^Create a new wallet'|previous app shows \\?"
hint = "Check sandbox/logs/app-*.log for 'atk-bridge: Couldn't listen on dbus server: Socket name too long': the sandbox's XDG_RUNTIME_DIR path was too long for a unix socket (fixed: sandbox.py keeps it at ~/.cache/rts/<tag>). Otherwise the app did not start: see the same log."

[[failure]]
id = "apksigner-no-java"
steps = ["sign-android"]
pattern = "(java: not found|the signer's file is not signed by|not signed by the release key)"
hint = "apksigner could not run (no java on PATH), so every certificate read as wrong. tools/rel sources tools/env.sh for JAVA_HOME; check `apksigner verify --print-certs` on signer/out by hand. When the cert is right, `tools/rel run sign-android` takes the files again from the signer's receipt: no new code."

[[failure]]
id = "android-dev-plugin-registrant"
steps = ["build-android", "build-play"]
pattern = "package dev\\.flutter\\.plugins\\.integration_test does not exist"
hint = "A flutter test in the release checkout (the screens tours) rewrote GeneratedPluginRegistrant.java with the dev plugins while the APK compiled. Let nothing run flutter test in that checkout, then `tools/rel retry <step>`; screens waits for the builds made in the checkout from now on."

[[failure]]
id = "android-driver-label-mismatch"
steps = ["trust-android"]
pattern = "send: no Send button on the review"
hint = "The driver did not recognise the review's button label. Compare the `send: review` dump in steps/<step>/out/screens.log (and shots/*-send-review.png) with the regex in tools/rellib/drivers/android/trust.py send_epicbox: 26.10.25 puts a no-break space before the unit (\"Send 0.01\\u00a0EPIC\"). Fix the driver on main, then `tools/rel retry <step>`."

[[failure]]
id = "relay-release-finished"
steps = ["publish-gate"]
pattern = "this release has finished; no new gates"
hint = "The run's live message ended (aborted when tools/rel was stopped by a signal) and the relay keeps a finished release closed. `tools/rel resume` reopens a stopped run under a new live message (<run id>+<n>); a superseded run stays closed: start a new run."

[[failure]]
id = "windows-stale-build-tree"
steps = ["build-windows"]
pattern = "(No target \"epic_wallet\"|Unable to generate build files)"
hint = "CMake ran in a Windows work dir left by an older build (a reused run id): its app\\build names targets that no longer exist. The work dir name carries the commit ({run_id}-{short}-{variant}); check the step's command uses it, then `tools/rel retry <step>`."
