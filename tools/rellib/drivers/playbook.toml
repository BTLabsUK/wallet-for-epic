# SPDX-License-Identifier: Apache-2.0
# The trust drivers' AI playbook: known screens and what gets past them, in terms of the AI loop's
# safe actions (click, scroll, expand, type, done, give_up; core/ailoop.py). The model reads the
# entries for its platform on every turn. Reviewed and kept in git; never edited by a lane: a lane
# proposes an entry (the `playbook.propose` event), a human accepts it, and `testdb playbook
# promote` writes it here and bumps `version`.
#
# key        a stable name, cited by the model as "pb"
# situation  what the screen looks like
# fix        what to do, in the safe actions
# platforms  linux | windows | macos | android | ios, or desktop | phone | all
# source     the 26.11.0 attempt or release/failures.toml entry it came from

version = 1

[[entry]]
key = "node-already-active"
situation = "The step wants a node server in use, and the Node page's status line already reads 'Node Synced: <host>' (or the server picker marks <host> as in use). There is no 'Use <host>' control because nothing needs choosing."
fix = "done: the goal is met. Do not click the node field or the checkboxes."
platforms = ["desktop"]
source = "26.11.0 run-4 trust-windows-tor: recover found '#29 Node Synced: node.btlabs.uk' with no 'Use node.btlabs.uk' button"

[[entry]]
key = "section-button-noop"
situation = "A section header button (e.g. 'Node', editable, its value the same as its name) where pressing it, its default action, changes nothing on the screen."
fix = "expand that node (its toggle), then look for the control again. Never click it a second time; it is not the control the step wants."
platforms = ["windows", "linux"]
source = "26.11.0 run-4 trust-windows-tor: 'use-node.btlabs.uk ... not reached after pressing #21 button Node [editable] (try 2)'"

[[entry]]
key = "picker-stale-after-add"
situation = "A server was just added through the picker's form, and the picker's list does not show it yet (it shows only the servers from before)."
fix = "give_up: the list is rebuilt when Settings is left and opened again; the recipe's stale-picker reread does that. Do not add the server again."
platforms = ["desktop"]
source = "26.11.0 run-4 trust-windows-notor: 'g4.server.node 127.0.0.1:50666 never listed'"

[[entry]]
key = "use-row-closes-picker"
situation = "After clicking a 'Use <host>, synced, <name>, <ms> ms, <version>' row, the picker closes and the page shows the Node section again."
fix = "done when the status line names <host>; otherwise click the server picker button once to read the list again. Never click the same 'Use' row twice in one turn."
platforms = ["desktop"]
source = "26.11.0 run-4 trust-windows-tor/notor: 'node.btlabs.uk in use not reached after pressing #35 button Use node.btlabs.uk, synced, BT Labs ... (try 1)'"

[[entry]]
key = "settings-no-dialog"
situation = "The test asked to get past an unknown screen, but the screen is the normal Settings page (section list, a section's controls, the main navigation) with no dialog, notice or onboarding step on top."
fix = "give_up: there is nothing to dismiss. Do not click navigation, section entries or settings controls to 'get past' it."
platforms = ["desktop"]
source = "26.11.0 run-4 trust-windows-tor: five advance calls on the Settings › Node page each found no dialog"

[[entry]]
key = "epicbox-picker-elsewhere"
situation = "The step wants the Epicbox server control, and the open page is Settings › Node, which only holds the node server, the auto-switch and 'This is my node' checkboxes."
fix = "give_up: the Epicbox picker sits under another Settings section (Network and privacy, or Payments › Methods on older builds); the recipe walks the sections."
platforms = ["desktop"]
source = "26.11.0 run-4 trust-windows-tor: 'the Epicbox picker not found under Settings (tried Node)' and 'no pick for g4.server.epicbox'"

[[entry]]
key = "first-run-tour"
situation = "A first-run tour overlay with a 'Skip tour' button covers the wallet."
fix = "click 'Skip tour'."
platforms = ["all"]
source = "26.11.0 run-4 trust-windows-*/linux-*: obstacle g4.tour.skip pressed on every lane"

[[entry]]
key = "last-session-notice"
situation = "A notice about a payment left unsent in the last session, with 'Not now' and an action that resumes the payment."
fix = "click 'Not now'. Never the resume or send action."
platforms = ["all"]
source = "26.11.0 run-4 trust-windows-*/linux-*: obstacle g4.lastsession.notnow pressed on every lane"

[[entry]]
key = "folded-section-list"
situation = "A narrow window: Settings shows one section at a time, and a button named like the open section holds the section name as its value; there is no list of sections."
fix = "click that selector button: it lists the sections again."
platforms = ["desktop"]
source = "26.11.0 run-4 trust-windows-tor: Settings at the rig's window width; core/desktop.py _open_section_list"

[[entry]]
key = "target-below-fold"
situation = "The control the step wants belongs on this page (its section and neighbours are there) but is not in the tree: the page is longer than the window."
fix = "scroll down once and look again; then scroll up once if it is still missing."
platforms = ["all"]
source = "26.11.0 run-4 trust-windows-tor: 'g4.server.use not on screen' on the Settings › Node page"

[[entry]]
key = "send-review"
situation = "A payment review screen: amount, fee, recipient and a 'Send <amount> EPIC' or 'Confirm' button."
fix = "give_up: the AI never sends or confirms. A label the recipe misses is fixed in the recipe (core/phone.py SEND_CONFIRM)."
platforms = ["all"]
source = "release/failures.toml android-v2-send-confirm, android-driver-label-mismatch"

[[entry]]
key = "copy-address-icon"
situation = "The Receive page: an address and a copy button that has an icon and a tooltip but maybe no visible text."
fix = "click the button whose id or name holds 'copy'. If none, give_up: the recipe's click map is out of date."
platforms = ["windows"]
source = "release/failures.toml windows-copy-address"

[[entry]]
key = "anr-dialog"
situation = "Android's own dialog '<app> isn't responding' with 'Close app' and 'Wait' buttons covers the wallet."
fix = "give_up: it is never pressed away. Pressing 'Wait' hid a frozen app and the lane went on (the old g4.system.anr.wait obstacle). The driver's alive_check (core/freeze.py) ends the lane PRODUCT 'the app froze' with a bundle when this dialog, am_anr or a StackOverflowError shows up."
platforms = ["android"]
source = "driver-resilience freeze plan: a wallet freezes on a StackOverflowError at unlock; the old obstacle would have waited it out"
