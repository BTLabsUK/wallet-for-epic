# SPDX-License-Identifier: Apache-2.0
# Refuses a run whose dispatch inputs are out of shape, that is not on main, or whose checkout
# carries another version than the one tools/rel asked for (tools/version.sh name). Every value is
# read from the environment, never pasted into the script. Works on Linux and on Windows (Git Bash).
name: check-inputs
description: The dispatch inputs, the branch and the version agree with the checkout
inputs:
  commit:
    required: true
  build-id:
    required: true
  version:
    required: true
  platforms:
    required: true
  variants:
    required: true
  kind:
    required: true
  request:
    required: true
  build-tag:
    required: true
  platform:
    description: This job's platform
    required: true
  variant:
    description: This job's matrix variant
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        WFE_COMMIT: ${{ inputs.commit }}
        WFE_BUILD_ID: ${{ inputs.build-id }}
        WFE_VERSION: ${{ inputs.version }}
        WFE_PLATFORMS: ${{ inputs.platforms }}
        WFE_VARIANTS: ${{ inputs.variants }}
        WFE_KIND: ${{ inputs.kind }}
        WFE_REQUEST: ${{ inputs.request }}
        WFE_BUILD_TAG: ${{ inputs.build-tag }}
        WFE_PLATFORM: ${{ inputs.platform }}
        WFE_VARIANT: ${{ inputs.variant }}
      run: |
        fail=0
        bad() { echo "::error::$1"; fail=1; }
        # A JSON array of distinct values from the allowed ones.
        json_set() { # <value> <allowed values...>
          local v="$1"; shift
          jq -e --args 'type == "array" and length > 0 and (unique | length) == length
            and all(.[]; type == "string" and IN($ARGS.positional[]))' "$@" <<<"$v" >/dev/null 2>&1
        }
        [[ "$WFE_COMMIT" =~ ^[0-9a-f]{40}$ && "$WFE_COMMIT" == "$GITHUB_SHA" ]] \
          || bad "commit '$WFE_COMMIT' is not this run's commit $GITHUB_SHA"
        [[ "$GITHUB_REF" == refs/heads/main ]] || bad "the run is on $GITHUB_REF, not refs/heads/main"
        [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || bad "the checkout is $(git rev-parse HEAD), not $GITHUB_SHA"
        [[ "$WFE_KIND" == dev || "$WFE_KIND" == release ]] || bad "kind '$WFE_KIND' is not dev or release"
        [[ "$WFE_BUILD_ID" =~ ^[A-Za-z0-9._-]{1,40}$ ]] || bad "build_id '$WFE_BUILD_ID' is not 1-40 of [A-Za-z0-9._-]"
        [[ "$WFE_REQUEST" =~ ^[A-Za-z0-9._-]{1,64}$ ]] || bad "request '$WFE_REQUEST' is not 1-64 of [A-Za-z0-9._-]"
        [[ "$WFE_BUILD_TAG" =~ ^(r[0-9]+)?$ ]] || bad "build_tag '$WFE_BUILD_TAG' is not empty or rN"
        [[ "$WFE_VERSION" =~ ^[0-9]{2}\.[0-9]{1,2}\.[0-9]{1,2}(-rc[0-9]+)?$ ]] || bad "version '$WFE_VERSION' is not YY.MM.patch[-rcN]"
        json_set "$WFE_PLATFORMS" android linux windows || bad "platforms '$WFE_PLATFORMS' is not a JSON set of android, linux, windows"
        json_set "$WFE_VARIANTS" tor notor || bad "variants '$WFE_VARIANTS' is not a JSON set of tor, notor"
        [[ "$WFE_VARIANT" == tor || "$WFE_VARIANT" == notor ]] || bad "variant '$WFE_VARIANT' is not tor or notor"
        name="$(bash tools/version.sh name | tr -d '\r')"
        [[ "$name" == "$WFE_VERSION" ]] || bad "tools/version.sh name gives '$name', the dispatch asked for '$WFE_VERSION'"
        echo "$WFE_PLATFORM $WFE_VARIANT: commit $GITHUB_SHA, version $name, build id $WFE_BUILD_ID${WFE_BUILD_TAG:+ $WFE_BUILD_TAG}, $WFE_KIND, request $WFE_REQUEST"
        exit "$fail"
