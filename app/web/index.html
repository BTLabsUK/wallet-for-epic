<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by flutter build's --base-href (tool/build_web.sh: /app/). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!-- No viewport meta: the Flutter engine sets its own. -->
  <title>BT Wallet: try it in your browser</title>
  <meta name="description" content="BT Wallet, a free Epic Cash wallet to try in your browser. Each visitor gets a test wallet for 24 hours, with test coins, sending and receiving.">
  <meta name="theme-color" content="#08080A">
  <meta name="color-scheme" content="dark light">

  <!-- Flutter output cannot be crawled, so links straight to /app/ get their card from here. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="BT Wallet">
  <meta property="og:title" content="BT Wallet: try it in your browser">
  <meta property="og:description" content="A test wallet for 24 hours. Get test coins, send, receive and pay invoices before you download anything.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:image:alt" content="The BT Wallet icon: the gold BT mark on black">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="BT Wallet: try it in your browser">
  <meta name="twitter:description" content="A test wallet for 24 hours. Get test coins, send, receive and pay invoices before you download anything.">
  <meta name="twitter:image" content="icons/Icon-512.png">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BT Wallet">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #08080A; overflow: hidden; }
    /* The splash: the mark on the brand black until Flutter's first frame, when
       lib/src/web/splash_web.dart removes it. */
    #splash {
      position: fixed; inset: 0; z-index: 2147483647;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 50%, #29251A 0, #08080A 60%);
    }
    #splash svg { width: 84px; height: auto; }
    @media (prefers-reduced-motion: no-preference) {
      #splash svg { animation: wfe-glow 1.6s ease-in-out infinite alternate; }
      @keyframes wfe-glow { from { opacity: .55; } to { opacity: 1; } }
    }
  </style>
</head>
<body>
  <div id="splash" role="img" aria-label="BT Wallet is loading">
    <!-- The BT Wallet mark from the brand kit (bt-wallet-mark-gold.svg). -->
    <svg viewBox="2 33 641 554.7" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="splash-gold" x1="0" y1="33" x2="0" y2="587.7" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#F9E09A"/><stop offset=".45" stop-color="#F6D471"/><stop offset="1" stop-color="#C98A3E"/>
        </linearGradient>
      </defs>
      <g fill="url(#splash-gold)">
      <polygon points="197,105.46 322.5,33 448,105.46 448,165.46 322.5,93 197,165.46"/>
      <polygon points="58,97 187,171.48 214.27,247.22 85.27,172.74"/>
      <polygon points="587,97 458,171.48 430.73,247.22 559.73,172.74"/>
      <polygon points="222,256 322.5,314.02 423,256 395.73,331.74 322.5,374.02 249.27,331.74"/>
      <polygon points="2,209 143,290.41 170.27,366.15 29.27,284.74"/>
      <polygon points="643,209 502,290.41 474.73,366.15 615.73,284.74"/>
      <polygon points="171,374 249,419.03 322.5,376.6 396,419.03 474,374 446.73,449.74 396,479.03 322.5,436.6 249,479.03 198.27,449.74"/>
      <polygon points="252,487 322.5,527.7 393,487 365.73,562.74 322.5,587.7 279.27,562.74"/>
      </g>
    </svg>
  </div>
  <noscript>BT Wallet needs JavaScript.</noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
