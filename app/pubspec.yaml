name: epic_wallet
description: Epic Cash Desktop and Epic Cash Mobile, wallets for Epic Cash.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The app's version, the one source of truth (https://docs.btlabs.uk/developers/releases/): calendar versioning
# YY.MM.patch, and the build number derived from it (YY*1000000 + MM*10000 + patch*100 +
# rebuild), which Android uses as versionCode. Set it only with `tools/version.sh set`, at release
# time; `tools/version.sh check` fails when anything else disagrees with it.
version: 26.10.24+26102400

environment:
  sdk: ^3.13.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  # UI translations: gen-l10n reads lib/l10n/*.arb (see l10n.yaml). intl is the version
  # flutter_localizations already resolves; it formats numbers, dates and plurals per locale.
  flutter_localizations:
    sdk: flutter
  intl: 0.20.3

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: 3.4.3
  path_provider: 2.1.6
  pretty_qr_code: 3.6.0
  flutter_secure_storage: 11.2.0
  # The crash-safe Windows secret store (windows_dpapi.dart): DPAPI and MoveFileEx. The versions
  # flutter_secure_storage_windows already locks.
  ffi: 2.2.0
  win32: 6.4.0
  local_auth: 3.0.2
  # Its Android prompt texts (AndroidAuthMessages), so the prompt speaks the app's language.
  local_auth_android: 2.2.0
  crypto: 3.0.7
  # X25519, HKDF and AES-GCM for sealed support reports (support_report.dart), pure Dart.
  cryptography: 2.9.0
  # The password crack-time hint (lib/src/password_estimate.dart). Exact: the wrapper there
  # imports its src/. Its compiled-in word lists are not imported (13 MB); the lists ship as
  # gzipped assets instead (assets/passwords, tool/password_lists.sh).
  zxcvbnm: 1.1.1
  # The wallet core (lepic_wallet_service.dart and what it imports) runs without Flutter, in
  # the demo server and bin/core_check.dart, so it takes these from their packages rather than
  # through Flutter. web is for the browser build. All three at the versions Flutter locks.
  characters: 1.4.1
  meta: 1.18.3
  web: 1.1.1
  # ExternalLibrary for initLepic(libraryPath:), which a plain `dart run` needs because the
  # default load by name fails outside a Flutter bundle. The version lepic pins.
  flutter_rust_bridge: 2.13.0
  file_picker: 13.1.0
  share_plus: 13.3.0
  # QR scanning on the phones (Android, iOS; scanner_backend.dart): the camera's frames, read
  # by zxing-cpp. Free code only, no Google ML Kit or Play services. Hidden where unsupported.
  camera: 0.12.2
  flutter_zxing: 3.1.0
  # Full brightness while a payment QR code shows (the window's brightness, never the system
  # setting; lib/src/screen_brightness.dart).
  screen_brightness: 2.1.11
  # The desktop window without the system's title bar: the app draws its own (title_bar.dart);
  # the OS keeps the frame, shadow, snapping and moving.
  window_manager: 0.5.2
  # Windows 11's snap layouts flyout on the title bar's maximise button (desk_window.dart).
  snap_layouts: 0.2.0
  # The displays' work areas and scale for the window's first size and its saved place
  # (window_placement.dart); window_manager's own dependency, at the version it resolves.
  screen_retriever: 0.2.2
  # The LEPIC core behind --dart-define=WFE_CORE=lepic: the lepic-flutter binding, a clone pinned
  # by tools/lepic-flutter.rev. tools/lepic.sh sync creates it (and the LEPIC clone at
  # tools/lepic.rev, the binding's own pin) and tools/lepic.sh build builds its libraries.
  lepic:
    path: third_party/lepic-flutter
  # Help illustrations (assets/help); exact, as the lockfile resolves it.
  flutter_svg: 2.3.0
  # hook/build.dart, which bundles the macOS lepic-ffi library. The versions package:lepic
  # already brings in.
  code_assets: 1.2.1
  hooks: 2.0.2
  # The settings file (lib/src/settings_file/): its values; where each key sits is our own scan.
  toml: 0.18.0

dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
  flutter_secure_storage_platform_interface: any
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  # Runs gen-l10n on pub get, run, build and test.
  generate: true

  # The Protocol look (lib/src/ui/theme/) and the Thai fallback. All OFL 1.1; the licence texts
  # are registered with LicenseRegistry in main.dart, so they show on the licences page.
  assets:
    - assets/fonts/OFL-Montserrat.txt
    - assets/fonts/OFL-JetBrainsMono.txt
    - assets/fonts/OFL-NotoSansThai.txt
    # Word lists for the password estimate, from zxcvbn-ts (MIT; NOTICE.txt has the notices).
    - assets/passwords/
    # Tor's licence; the tor binary itself ships beside the app (tools/fetch-tor.sh).
    - assets/licenses/tor.txt
    - assets/licenses/tor-source.txt
    - assets/licenses/status-icons.txt
    # Help illustrations (settings design); drawn in the theme colours by HelpArt.
    - assets/help/
    # Language flags (lipis/flag-icons, MIT; the licence is registered with the fonts', see
    # lib/src/ui/theme/fonts.dart).
    - assets/flags/
    # The two settings files (docs/settings-file.md): the first-start copy of the user's
    # settings.toml, and the read-only app configuration.
    - assets/config/settings.default.toml
    - assets/config/app-config.toml
  fonts:
    # Display only: the balance, screen titles and section heads. Body text is the platform font.
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
    # Data only: readouts, amounts in lists, slate ids. The no-ligature cut, so "->" stays two
    # characters in an address or an id.
    - family: JetBrainsMonoNL
      fonts:
        - asset: assets/fonts/JetBrainsMonoNL-Regular.ttf
    # Tor, Epicbox, Direct · HTTP and Node glyphs (tools/status_icons_font.py; lib/src/ui/status_icons.dart).
    - family: EpicStatusIcons
      fonts:
        - asset: assets/fonts/EpicStatusIcons.ttf
    # Thai, as the fallback of every text style (thaiFallback in lib/src/ui/theme/fonts.dart):
    # Montserrat, JetBrains Mono and the platform fonts on some systems have no Thai, and a
    # system fallback may clip the marks above and below. Noto Sans Thai 2.002, hinted, OFL.
    - family: NotoSansThai
      fonts:
        - asset: assets/fonts/NotoSansThai-Regular.ttf
        - asset: assets/fonts/NotoSansThai-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansThai-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansThai-Bold.ttf
          weight: 700

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
