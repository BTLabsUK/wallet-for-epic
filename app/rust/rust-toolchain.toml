[toolchain]
# Matches epic-wallet's own pin (playground/src/epic-wallet/rust-toolchain.toml).
# native_toolchain_rust requires an exact channel version for reproducible builds.
channel = "1.89.0"
profile = "minimal"
components = ["rustfmt", "clippy"]
targets = [
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "x86_64-linux-android",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "x86_64-apple-ios",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
